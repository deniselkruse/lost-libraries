<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A stack of books on fire" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- THE LOST LIBRARIES — favicon.

       A stack of books burning, the fire rising from behind so its outer
       tongues show past the edges of the stack.

       The fire is ONE connected path, drawn three times and scaled about
       its own base (32,48) to make the inner layers. Three separate
       tongues read as droplets rather than flame, and scaling a copy of
       the same silhouette keeps the inner tongues aligned with the outer
       ones, so the whole thing still holds together at 16px — the only
       size that really has to work.

       #7a2c0c outer, #a8401a mid (the same red the catalogue uses for
       armed conflict), #e0812e core. The core is scaled 0.6 so that its
       tip clears the top book; smaller and the stack hides it, and then
       the layering is invisible at every size. -->
  <rect width="64" height="64" fill="#120f0c"/>
  <path d="M12 48 C12 37, 14 30, 17 21 C18.5 28, 20 31, 22.5 34 C24 24, 27 15, 31 3 C34.5 15, 38 24, 40 32 C42 28, 44 24, 46.5 18 C50 27, 52 37, 52 48 Z" fill="#7a2c0c"/>
  <g transform="translate(32,48) scale(0.82) translate(-32,-48)"><path d="M12 48 C12 37, 14 30, 17 21 C18.5 28, 20 31, 22.5 34 C24 24, 27 15, 31 3 C34.5 15, 38 24, 40 32 C42 28, 44 24, 46.5 18 C50 27, 52 37, 52 48 Z" fill="#a8401a"/></g>
  <g transform="translate(32,48) scale(0.6) translate(-32,-48)"><path d="M12 48 C12 37, 14 30, 17 21 C18.5 28, 20 31, 22.5 34 C24 24, 27 15, 31 3 C34.5 15, 38 24, 40 32 C42 28, 44 24, 46.5 18 C50 27, 52 37, 52 48 Z" fill="#e0812e"/></g>
  <rect x="15" y="50" width="34" height="7" rx="1" fill="#f4f1ea"/>
  <rect x="19" y="42" width="27" height="7" rx="1" fill="#ded5c4"/>
  <rect x="16" y="34" width="32" height="7" rx="1" fill="#c3bbae"/>
</svg>
