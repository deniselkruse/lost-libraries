<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>The Lost Libraries — Geographic Atlas of Erasure</title>
<meta name="description" content="Interactive world map of 108 libraries destroyed across 3,785 years of history.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;0,600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f4f1ea; --parch:#120f0c; --aged:#2a231c;
    --ember:#8f3410; --gold:#5f4310; --ash:#c3bbae; --smoke:#3d342a;
    --panel:#fbf8f2; --sea:#e7e0d2; --land:#ded5c4; --coast:#a89a82;
    --focus:#7a3a10;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{background:var(--ink);color:var(--parch);font-family:'Crimson Pro',Georgia,serif;font-size:17px}

  .skip{position:absolute;top:-100px;left:1rem;background:var(--focus);color:#000;padding:.55rem 1.1rem;z-index:9999;
        text-decoration:none;font-family:'Courier Prime',monospace;font-weight:700;font-size:.85rem;border-radius:0 0 4px 4px}
  .skip:focus{top:0}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px}

  /* ---------- MAP STAGE ---------- */
  #stage{position:absolute;inset:0;background:var(--sea);overflow:hidden;cursor:grab;
         touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
  #stage.dragging{cursor:grabbing}
  #map{display:block;width:100%;height:100%;touch-action:none}
  .country{fill:var(--land);stroke:var(--coast);stroke-width:.35;vector-effect:non-scaling-stroke}
  .grat{fill:none;stroke:rgba(18,15,12,.05);stroke-width:.4;vector-effect:non-scaling-stroke}

  .mk{cursor:pointer;vector-effect:non-scaling-stroke}
  .mk:hover .mk-core{stroke:#120f0c;stroke-width:1.6}
  .mk-core{stroke:rgba(18,15,12,.45);stroke-width:.8;vector-effect:non-scaling-stroke}
  .mk.sel .mk-core{stroke:#120f0c;stroke-width:2.2;vector-effect:non-scaling-stroke}
  .mk.approx .mk-core{stroke-dasharray:2.2 1.6}
  .mk-halo{fill:none;opacity:0;transition:opacity .2s}
  .mk.sel .mk-halo{opacity:.55}

  /* ---------- LOADING / ERROR ---------- */
  #boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
        gap:.9rem;background:var(--sea);z-index:50;text-align:center;padding:2rem}
  #boot.hide{display:none}
  .boot-t{font-family:'Courier Prime',monospace;font-size:.75rem;letter-spacing:.25em;text-transform:uppercase;color:var(--gold)}
  .boot-s{font-family:'Crimson Pro',serif;font-style:italic;color:var(--smoke);max-width:420px;line-height:1.7;font-size:1rem}
  .spin{width:26px;height:26px;border:2px solid rgba(18,15,12,.2);border-top-color:var(--ember);border-radius:50%;
        animation:sp .9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- TOP BAR ---------- */
  #top{position:absolute;top:0;left:0;right:0;z-index:20;padding:.9rem 1.1rem 2.6rem;
       background:linear-gradient(180deg,rgba(244,241,234,.97) 0%,rgba(244,241,234,.85) 62%,transparent 100%);
       display:flex;gap:1.2rem;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
  #top > *{pointer-events:auto}
  .brand p{font-family:'Courier Prime',monospace;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:.1rem}
  .brand h1{font-family:'Playfair Display',serif;font-size:clamp(1rem,2.4vw,1.45rem);font-weight:900;line-height:1.05}
  .brand h1 em{font-style:italic;color:var(--ember)}

  .ctrls{display:flex;flex-direction:column;gap:.5rem;flex:1;min-width:230px}
  .row{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
  .lbl{font-family:'Courier Prime',monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--smoke);margin-right:.2rem}
  .fb{font-family:'Courier Prime',monospace;font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;
      padding:.42rem .75rem;border:1px solid rgba(18,15,12,.22);background:rgba(244,241,234,.8);color:var(--smoke);
      cursor:pointer;border-radius:2px;transition:.18s;white-space:nowrap;min-height:30px}
  .fb:hover{border-color:var(--ember);color:var(--parch)}
  .fb[aria-pressed="true"]{color:var(--ember);border-color:var(--ember);background:rgba(168,64,26,.12)}
  .fb .sw{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:.35rem;vertical-align:middle}

  input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:3px;background:rgba(18,15,12,.2);
                    border-radius:2px;outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--ember);border-radius:50%;cursor:pointer}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;background:var(--ember);border:none;border-radius:50%;cursor:pointer}
  #eraOut{font-family:'Courier Prime',monospace;font-size:.66rem;color:var(--ember);min-width:9.5rem}

  /* ---------- ZOOM ---------- */
  #zoom{position:absolute;right:.9rem;bottom:7.4rem;z-index:30;display:flex;flex-direction:column;gap:.4rem}
  .zb{width:46px;height:46px;border:1px solid rgba(18,15,12,.28);background:rgba(244,241,234,.94);color:var(--aged);
      font-size:1.3rem;cursor:pointer;border-radius:3px;line-height:1;
      display:flex;align-items:center;justify-content:center;
      -webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .zb:hover,.zb:active{border-color:var(--ember);color:var(--ember);background:rgba(168,64,26,.12)}
  .zb.sm{font-size:.56rem;letter-spacing:.06em}

  /* ---------- BOTTOM ---------- */
  #bot{position:absolute;bottom:0;left:0;right:0;z-index:20;padding:2.4rem 1.1rem .85rem;
       background:linear-gradient(0deg,rgba(244,241,234,.97) 0%,rgba(244,241,234,.85) 62%,transparent 100%);
       display:flex;gap:1.6rem;align-items:flex-end;flex-wrap:wrap;pointer-events:none}
  #bot > *{pointer-events:auto}
  .stat{text-align:center}
  .stat-n{font-family:'Playfair Display',serif;font-size:1.65rem;font-weight:700;color:var(--ember);line-height:1}
  .stat-l{font-family:'Courier Prime',monospace;font-size:.54rem;letter-spacing:.14em;text-transform:uppercase;color:var(--smoke);margin-top:.15rem}
  .note{margin-left:auto;max-width:300px;text-align:right}
  .note b{display:block;font-family:'Courier Prime',monospace;font-size:.55rem;letter-spacing:.14em;
          text-transform:uppercase;color:var(--smoke);margin-bottom:.22rem;font-weight:400}
  .note span{font-size:.82rem;font-style:italic;color:rgba(18,15,12,.6);line-height:1.5}

  /* ---------- PANEL ---------- */
  #panel{position:absolute;top:0;right:0;bottom:0;width:340px;max-width:100%;background:var(--panel);z-index:40;
         border-left:1px solid rgba(18,15,12,.13);transform:translateX(100%);
         transition:transform .34s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column}
  #panel.open{transform:none}
  #pclose{position:absolute;top:.6rem;right:.6rem;background:none;border:none;color:var(--smoke);
          font-size:1.3rem;cursor:pointer;padding:.25rem .45rem;line-height:1}
  #pclose:hover{color:var(--parch)}
  #pin{overflow-y:auto;padding:1.5rem 1.4rem 2rem;flex:1}
  #pin::-webkit-scrollbar{width:3px}
  #pin::-webkit-scrollbar-thumb{background:var(--ash)}
  .pb{font-family:'Courier Prime',monospace;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;
      padding:.2rem .7rem;border:1px solid;display:inline-block;margin-bottom:.7rem}
  .pt{font-family:'Playfair Display',serif;font-size:1.35rem;line-height:1.2;margin-bottom:.3rem}
  .pl{font-family:'Courier Prime',monospace;font-size:.66rem;color:var(--smoke);margin-bottom:.4rem}
  .papprox{font-family:'Courier Prime',monospace;font-size:.58rem;color:var(--gold);
           border:1px solid rgba(208,160,64,.3);padding:.18rem .5rem;display:inline-block;margin-bottom:1rem}
  .pd{font-size:.97rem;color:var(--aged);line-height:1.85}
  .pp{margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid rgba(18,15,12,.1)}
  .pp b{display:block;font-family:'Courier Prime',monospace;font-size:.55rem;letter-spacing:.2em;
        text-transform:uppercase;color:var(--ember);margin-bottom:.2rem;font-weight:400}
  .pp span{font-size:.9rem;color:var(--smoke)}
  .psame{margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid rgba(18,15,12,.1)}
  .psame b{display:block;font-family:'Courier Prime',monospace;font-size:.55rem;letter-spacing:.2em;
           text-transform:uppercase;color:var(--smoke);margin-bottom:.45rem;font-weight:400}
  .psame button{display:block;width:100%;text-align:left;background:none;border:none;border-left:2px solid;
                padding:.3rem .6rem;margin-bottom:.25rem;color:var(--aged);font-family:'Crimson Pro',serif;
                font-size:.88rem;cursor:pointer}
  .psame button:hover{background:rgba(255,255,255,.04);color:var(--parch)}

  /* ---------- TOOLTIP ---------- */
  #tip{position:absolute;z-index:45;pointer-events:none;display:none;background:rgba(251,248,242,.97);
       border:1px solid rgba(18,15,12,.2);padding:.42rem .7rem;max-width:230px}
  #tip .n{font-family:'Playfair Display',serif;font-size:.9rem;line-height:1.25}
  #tip .m{font-family:'Courier Prime',monospace;font-size:.6rem;color:var(--smoke);margin-top:.12rem}

  @media(max-width:640px){
    #panel{width:100%}
    #top{padding:.7rem .8rem 2.2rem;gap:.7rem}
    #bot{padding:2rem .8rem .7rem;gap:1rem}
    .note{display:none}
    #zoom{bottom:6.4rem;right:.7rem}
    input[type=range]{width:110px}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a href="#panel" class="skip">Skip to details panel</a>

<div id="stage">
  <svg id="map" role="application" aria-label="World map of destroyed libraries. Use arrow keys to pan, plus and minus to zoom.">
    <g id="gGrat"></g><g id="gLand"></g><g id="gMarks"></g>
  </svg>
</div>

<div id="top">
  <div class="brand">
    <p>Lost Libraries &mdash; Geographic Atlas</p>
    <h1>The Lost <em>Libraries</em></h1>
  </div>
  <div class="ctrls">
    <div class="row" role="group" aria-label="Filter by cause of destruction" id="causeRow">
      <span class="lbl">Cause</span>
    </div>
    <div class="row">
      <span class="lbl">Era</span>
      <input type="range" id="era" min="0" max="9" value="0" aria-label="Filter by historical era">
      <span id="eraOut">All eras</span>
    </div>
  </div>
</div>

<div id="zoom">
  <button class="zb" id="zin"  aria-label="Zoom in">+</button>
  <button class="zb" id="zout" aria-label="Zoom out">&minus;</button>
  <button class="zb sm" id="zres"  aria-label="Reset to default view">RESET</button>
  <button class="zb sm" id="zworld" aria-label="Show whole world">WORLD</button>
</div>

<div id="bot">
  <div class="stat"><div class="stat-n" id="sShown">108</div><div class="stat-l">Shown</div></div>
  <div class="stat"><div class="stat-n" id="sSites">—</div><div class="stat-l">Map Sites</div></div>
  <div class="stat"><div class="stat-n">108</div><div class="stat-l">Total Records</div></div>
  <div class="note">
    <b>A note on the pins</b>
    <span>Pinch or double-tap to zoom. Dashed rings mark records covering a whole region, not one address.</span>
  </div>
</div>

<div id="panel" role="complementary" aria-label="Library details" aria-hidden="true">
  <button id="pclose" aria-label="Close details panel">&#x2715;</button>
  <div id="pin"></div>
</div>

<div id="tip" role="tooltip"></div>

var LIBRARIES = [
  {id:1, name:"Library of Zimri-Lim", year:-1761, cause:"war", lat:34.55, lon:40.88, loc:"Mari, Mesopotamia", perp:"Hammurabi of Babylon", desc:"One of the oldest recorded library destructions in history. Hammurabi conquered Mari and razed its palace, destroying a vast archive of cuneiform tablets — one of the richest administrative and literary collections of the Bronze Age. The world's first documented biblioclasm."},
  {id:2, name:"Library of Ashurbanipal", year:-612, cause:"war", lat:36.36, lon:43.15, loc:"Nineveh, Neo-Assyrian Empire", perp:"Coalition of Babylonians, Scythians & Medes", desc:"A supreme irony: the fire that destroyed Nineveh baked the clay tablets and preserved them for 2,600 years. The library held the Epic of Gilgamesh and the largest collection of the ancient Near East. Much of what we know of Mesopotamian literature survived precisely because the library burned."},
  {id:3, name:"Xianyang Palace and State Archives", year:-206, cause:"war", lat:34.36, lon:108.72, loc:"Xianyang, Qin China", perp:"Xiang Yu", desc:"Rebel general Xiang Yu burned the Qin imperial palace for three months. The archives held records of the very book burnings Qin Shi Huang had ordered decades earlier — a destruction of the documentation of prior destruction. A recursive erasure spanning generations."},
  {id:4, name:"Library of Pergamon", year:-133, cause:"war", lat:39.13, lon:27.18, loc:"Pergamon, Asia Minor", perp:"Rome / Mark Antony", desc:"The second greatest library of antiquity after Alexandria, holding an estimated 200,000 scrolls. When the last king of Pergamon bequeathed his kingdom to Rome, the library's fate became entangled in power struggles. Mark Antony allegedly stripped its entire contents and gave them to Cleopatra as a gift — transferring one civilisation's memory to another as a romantic gesture."},
  {id:5, name:"Library of Alexandria", year:-48, cause:"war", lat:31.2, lon:29.92, loc:"Alexandria, Egypt", perp:"Disputed — Caesar, Aurelian, Theophilus & others", desc:"The most mythologized library destruction in history. Alexandria suffered multiple partial destructions across centuries, not one catastrophic burning. At its height it may have held 700,000 scrolls — the sum of ancient Mediterranean knowledge. Its loss was less an event than a slow bleed across four centuries."},
  {id:6, name:"Imperial Library of Luoyang", year:189, cause:"war", lat:34.68, lon:112.45, loc:"Luoyang, Han China", perp:"Dong Zhuo", desc:"Warlord Dong Zhuo deliberately burned Luoyang to slow pursuing enemies. The imperial library, holding Han dynasty archives on silk and bamboo scrolls, burned with the city. Thousands of irreplaceable texts lost in a single afternoon of scorched-earth strategy."},
  {id:7, name:"Library of Celsus", year:262, cause:"fire", lat:37.94, lon:27.34, loc:"Ephesus, Asia Minor", perp:"Herulian invasion / earthquake", desc:"The third largest library of the ancient world, holding 12,000 scrolls. Built as a monument to the Roman senator Celsus, its magnificent facade still stands in modern Turkey. Destroyed in 262 AD during the Herulian sack of Ephesus, possibly preceded by an earthquake. The building survived as a shell for centuries after the knowledge inside was ash."},
  {id:8, name:"Library of Pantainos", year:267, cause:"war", lat:37.97, lon:23.72, loc:"Athens, Roman Greece", perp:"Heruli invasion", desc:"The Library of Pantainos, donated to Athens in the 2nd century AD, was destroyed during the Herulian invasion of 267. The Heruli sacked Athens in a devastating raid that wiped out much of the city's classical heritage. The library was never rebuilt."},
  {id:9, name:"Hadrian's Library", year:267, cause:"war", lat:37.975, lon:23.725, loc:"Athens, Roman Greece", perp:"Heruli invasion", desc:"Built by Emperor Hadrian in 132 AD, this vast complex held hundreds of rooms of papyrus scrolls alongside lecture halls and gardens. Seriously damaged in the Herulian invasion of 267, its scholarly function never fully recovered. The site is now an archaeological ruin in central Athens."},
  {id:10, name:"Library of Antioch", year:364, cause:"religion", lat:36.2, lon:36.16, loc:"Antioch, Roman Syria", perp:"Emperor Jovian", desc:"Emperor Jovian ordered the destruction of Antioch's great library, which Julian the Apostate had richly stocked with philosophical and scientific works from across the ancient world. An ideological purge disguised as administrative action."},
  {id:11, name:"Library of the Serapeum", year:392, cause:"religion", lat:31.18, lon:29.9, loc:"Alexandria, Egypt", perp:"Bishop Theophilus of Alexandria", desc:"The daughter library of Alexandria, housed in the Temple of Serapis, was destroyed when Bishop Theophilus converted the pagan temple to a church. What remained of ancient Alexandrian scholarship was extinguished in the name of the new faith — a theological coup dressed as renovation."},
  {id:12, name:"Library of York (Eboracum)", year:867, cause:"war", lat:53.96, lon:-1.08, loc:"York, England", perp:"Viking Great Heathen Army", desc:"York was the greatest centre of learning in 8th-century Europe, its library assembled by the scholar Alcuin — tutor to Charlemagne and a key architect of the Carolingian Renaissance. The Viking Great Heathen Army's sack in 867 AD effectively ended York's role as a European intellectual hub. Alcuin had already left for France; what remained was lost. Alcuin had catalogued the collection in a poem naming over 200 authors and carried many of the best volumes to Charlemagne's court in 782, seeding the libraries of Frankish Europe before the Vikings took the rest."},
  {id:13, name:"Library of al-Hakam II", year:976, cause:"religion", lat:37.88, lon:-4.78, loc:"Cordoba, Al-Andalus", perp:"Al-Mansur & conservative scholars", desc:"Caliph al-Hakam II assembled 400,000 volumes — the largest library in 10th-century Europe. After his death, regent Al-Mansur burned all books on philosophy and ancient science to curry favor with conservative clerics. The greatest library of medieval Europe destroyed by its own government."},
  {id:14, name:"Library of Rayy", year:1029, cause:"religion", lat:35.6, lon:51.44, loc:"Rayy, Buyid Emirate", perp:"Sultan Mahmud of Ghazni", desc:"Sultan Mahmud conquered Rayy and ordered the burning of its library, destroying all books he deemed heretical. The Buyid Emirate had been a great patron of philosophy and science; this purge targeted precisely those achievements."},
  {id:15, name:"Library at Sazava Monastery", year:1097, cause:"religion", lat:49.87, lon:14.9, loc:"Sazava, Holy Roman Empire", perp:"Abbot Diethard", desc:"After the Slavonic Benedictines were expelled from Sazava Monastery, the new Latin-rite abbot Diethard ordered the destruction of Slavonic books and manuscripts collected there for decades. The loss eliminated the primary repository of Old Church Slavonic literary culture in Bohemia."},
  {id:16, name:"Library of Banu Ammar (Dar al-Ilm)", year:1109, cause:"war", lat:34.43, lon:35.85, loc:"Tripoli, Fatimid Caliphate", perp:"Crusaders under Baldwin I", desc:"Medieval chroniclers credited the library with up to three million volumes. The figure comes from later Arabic sources and is almost certainly inflated, but every account agrees the collection was among the largest in the Islamic world. When Crusaders took the city it reportedly took days to burn. Muslim sources say soldiers used manuscripts as toilet paper before burning them. Contemporaries described it as a catastrophe without precedent. Muslim chroniclers wrote that scholars wept as manuscripts were fed to the flames over several days."},
  {id:17, name:"Library of Ghazna", year:1151, cause:"war", lat:33.55, lon:68.42, loc:"Ghazna, Ghurid Empire", perp:"Ala al-Din Husayn", desc:"The city of Ghazna was sacked and burned for seven days as revenge for the killing of two brothers. Libraries and palaces built by the Ghaznavid dynasty — the dynasty that had produced the great scholar Al-Biruni — were destroyed in the prolonged act of retribution."},
  {id:18, name:"Library of Nishapur", year:1154, cause:"war", lat:36.21, lon:58.8, loc:"Nishapur, Seljuk Empire", perp:"Oghuz Turks", desc:"Nishapur, birthplace of Omar Khayyam and one of the great intellectual cities of the Islamic world, was partially destroyed during the collapse of the Seljuk Empire. Its libraries — at least thirteen institutions that had made it a centre of learning along the Silk Road — were sacked and burned."},
  {id:19, name:"Library of the Church of Jacob Mar", year:1171, cause:"war", lat:37.06, lon:41.22, loc:"Nisibis, Zengid State", perp:"Nur al-Din Zengi", desc:"The church and its library of 1,000 volumes were looted and destroyed by forces under Nur al-Din Zengi. Nisibis had been a significant centre of Syriac Christian scholarship since late antiquity; this destruction extinguished the last remnants of that tradition in the region."},
  {id:20, name:"Nalanda University Library", year:1193, cause:"war", lat:25.14, lon:85.44, loc:"Bihar, India", perp:"Bakhtiyar Khilji", desc:"The greatest repository of Buddhist scholarship in history — a university accumulating knowledge for 700 years. Persian chronicler Minhaj-i-Siraj wrote that the library burned for months, though he was writing decades later and from hearsay. A surviving monk said the soldiers asked what the burning buildings were, and by the time anyone could explain, it was too late."},
  {id:21, name:"Libraries of Constantinople (Fourth Crusade)", year:1204, cause:"war", lat:41.01, lon:28.98, loc:"Constantinople, Byzantine Empire", perp:"Fourth Crusade", desc:"Christian crusaders sacked the Christian capital, scattering a library that preserved classical Greek texts unknown in Western Europe. Works of Aristotle, Plato, and ancient drama were lost or scattered by soldiers who could not read them."},
  {id:22, name:"Imperial Library of Constantinople", year:1204, cause:"war", lat:41.015, lon:28.975, loc:"Constantinople, Byzantine Empire", perp:"Disputed — Fourth Crusade / Ottoman conquest", desc:"Founded in the 4th century and holding over 100,000 volumes at its height, the Imperial Library outlasted the libraries of Alexandria and Pergamon only to meet a disputed end. Scholars debate whether it was destroyed in the Crusader sack of 1204, during the Ottoman conquest of 1453, or lost to fires over centuries."},
  {id:23, name:"Alamut Castle Library", year:1256, cause:"war", lat:36.45, lon:50.57, loc:"Alamut, Persia", perp:"Mongols under Hulagu Khan", desc:"The Nizari Ismaili mountain fortress held a legendary library of astronomical and philosophical texts. Astronomer Nasir al-Din al-Tusi rescued some manuscripts before the Mongols arrived. What he saved quietly influenced European science for centuries."},
  {id:24, name:"House of Wisdom", year:1258, cause:"war", lat:33.34, lon:44.4, loc:"Baghdad, Iraq", perp:"Mongols under Hulagu Khan", desc:"The intellectual capital of the Islamic Golden Age. Chroniclers wrote that the Tigris ran black with ink and red with blood — an image repeated for centuries, though it comes from narrative accounts rather than any count of what was held. The sack was devastating and real. Modern scholarship is more cautious than the legend: Islamic intellectual life continued elsewhere, notably at Maragha, where al-Tusi built an observatory within years."},
  {id:25, name:"Libraries of Constantinople (Ottoman Conquest)", year:1453, cause:"war", lat:41.02, lon:28.96, loc:"Constantinople, Byzantine Empire", perp:"Ottoman Turks", desc:"The final fall of Constantinople scattered what survived of Byzantine scholarship. Fleeing scholars, carrying whatever texts they could, inadvertently seeded the Italian Renaissance — the destruction of one civilization sparking the birth of another."},
  {id:26, name:"Madrassah Library of Granada", year:1499, cause:"religion", lat:37.18, lon:-3.6, loc:"Granada, Spain", perp:"Cardinal Cisneros", desc:"80,000 Arabic manuscripts burned in Granada's central square as part of forced Christianization. Poetry, philosophy, history, astronomy — ash by morning. Cisneros later wrote admiringly about Arab learning, apparently without irony."},
  {id:27, name:"Bibliotheca Corviniana", year:1526, cause:"war", lat:47.5, lon:19.04, loc:"Buda, Hungary", perp:"Ottoman Turks", desc:"King Matthias Corvinus assembled what was considered the second greatest library in Europe after the Vatican — over 2,000 illuminated manuscripts. When the Ottomans defeated Hungary at Mohacs in 1526, the library was looted and scattered. Some manuscripts ended up in Istanbul; others disappeared entirely. What survived became treasures in museums across three continents. Scholars spent centuries afterwards tracking down surviving volumes scattered across European collections."},
  {id:28, name:"English Monastic Libraries", year:1535, cause:"govt", lat:52.5, lon:-1.5, loc:"England", perp:"Royal officials under Henry VIII", desc:"The Dissolution of the Monasteries scattered and destroyed centuries of medieval scholarship. Manuscripts were used as wastepaper, bookbinders' material, and kindling. One visitor described monastery books being used to scrub candlesticks. An entire literary heritage decimated in a decade for political and economic gain."},
  {id:29, name:"Glasney College Library", year:1548, cause:"govt", lat:50.16, lon:-5.1, loc:"Penryn, Cornwall", perp:"Royal officials under Edward VI", desc:"The destruction of Glasney College erased the only institutional repository of the Cornish literary tradition. The Cornish language's near-extinction began here, with a pile of burning manuscripts."},
  {id:30, name:"Records on Gozo", year:1551, cause:"war", lat:36.04, lon:14.24, loc:"Gozo, Hospitaller Malta", perp:"Ottoman Turks", desc:"Most paper records held on Gozo were lost during an Ottoman raid in 1551. The raid depopulated much of the island, and the administrative and historical records that documented Gozo's medieval history were either taken or burned. An entire chapter of Maltese documentary history erased in a single raid."},
  {id:31, name:"Maya Codices of the Yucatan", year:1562, cause:"religion", lat:20.39, lon:-89.56, loc:"Mani, Mexico", perp:"Bishop Diego de Landa", desc:"De Landa burned virtually the entire written record of Maya civilization in a single auto-da-fe. Only 4 Maya codices survive today. He later wrote a book about Maya culture using oral knowledge from survivors — a record of the civilization whose written memory he himself destroyed."},
  {id:32, name:"Raglan Castle Library", year:1646, cause: "war", lat:51.77, lon:-2.87, loc:"Raglan, Wales", perp:"Parliamentary Army", desc:"The Earl of Worcester's library was burned during the English Civil War — not as military necessity but as cultural contempt for the Royalist aristocracy. The books were a proxy for the men who owned them."},
  {id:33, name:"Swedish National Library, Tre Kronor", year:1697, cause:"fire", lat:59.33, lon:18.07, loc:"Stockholm, Sweden", perp:"Accidental fire", desc:"The Tre Kronor castle fire of 1697 destroyed the Swedish National Library and Royal Archives housed within it. Centuries of Swedish royal records, medieval manuscripts, and the accumulated archives of the Vasa dynasty were lost. The fire began in a chimney and spread so rapidly that little could be saved."},
  {id:34, name:"University of Copenhagen Library", year:1728, cause:"fire", lat:55.68, lon:12.57, loc:"Copenhagen, Denmark", perp:"Copenhagen Fire of 1728", desc:"The great fire that devastated central Copenhagen in 1728 consumed the University Library, one of Scandinavia's most important scholarly collections. Thousands of volumes of Nordic history, theology, and natural philosophy — including irreplaceable manuscripts of Old Norse literature — were lost in the catastrophic blaze."},
  {id:35, name:"Cotton Library, London", year:1731, cause:"fire", lat:51.5, lon:-0.13, loc:"London, UK", perp:"Accidental fire at Ashburnham House", desc:"The Cotton Library, assembled by antiquary Robert Cotton and containing irreplaceable Anglo-Saxon manuscripts including Beowulf and two copies of Magna Carta, was severely damaged by fire at Ashburnham House in 1731. Around a quarter of the collection was destroyed or badly damaged. Many manuscripts crumbled to fragments that scholars spent centuries painstakingly reconstructing."},
  {id:36, name:"Royal Library of Portugal, Lisbon", year:1755, cause:"fire", lat:38.71, lon:-9.14, loc:"Lisbon, Portugal", perp:"Great Lisbon Earthquake and fire", desc:"The catastrophic Lisbon earthquake of 1755 triggered a tsunami and fires that burned for six days. The Royal Library in the Palace of Ribeira, holding 70,000 volumes including the only surviving records of Vasco da Gama's original voyages, was completely destroyed. The historical records of the Age of Discovery were lost in an afternoon of geological violence. Among the losses were the only surviving logs and charts from Vasco da Gama's voyages and the early Portuguese explorations, primary records of the Age of Discovery that cannot be reconstructed."},
  {id:37, name:"Zaluski Library", year:1794, cause:"war", lat:52.23, lon:21.01, loc:"Warsaw, Poland", perp:"Imperial Russian Army / Nazi German troops", desc:"One of Europe's first public libraries — 400,000 volumes. Russian forces carried off 262,000 volumes after the Kosciuszko Uprising of 1794. What remained was destroyed again by the Nazis in 1944. One library, two total destructions, 150 years apart."},
  {id:38, name:"Library of Congress (1814)", year:1814, cause:"war", lat:38.89, lon:-77, loc:"Washington D.C., USA", perp:"British Army", desc:"British forces burned the Capitol and its fledgling library during the War of 1812. Thomas Jefferson offered his personal collection of 6,487 books as a replacement — so philosophical and eclectic that some congressmen tried to reject it as too radical. His library became the seed of the modern LOC."},
  {id:39, name:"Several Libraries, Mexico", year:1856, cause: "war", lat:19.43, lon:-99.13, loc:"Mexico City & major cities, Mexico", perp:"Liberal troops & anti-clericalists", desc:"During and after the Mexican Reform War, liberal governments permitted or carried out the dispersal of numerous ecclesiastical libraries. Church collections accumulated over three centuries of colonial rule were broken up, sold off, or burned as part of anti-clerical reform policies."},
  {id:40, name:"Mughal Imperial Library, Delhi", year:1857, cause:"war", lat:28.65, lon:77.23, loc:"Delhi, India", perp:"British forces (Indian Rebellion)", desc:"The Mughal court's library represented centuries of accumulated scholarship — Persian manuscripts, Sanskrit translations, illuminated Qurans, works of Mughal art and science. When British forces entered Delhi following the suppression of the 1857 rebellion, the library was looted or destroyed. The last great repository of Mughal intellectual culture was dispersed in an afternoon."},
  {id:41, name:"University of Alabama Library", year:1865, cause:"war", lat:33.21, lon:-87.54, loc:"Tuscaloosa, Alabama, USA", perp:"Union Army troops", desc:"During the Civil War, Union troops destroyed most buildings on the University of Alabama campus including the library. According to legend, only one book survived — an English translation of the Quran that a soldier chose to pocket rather than burn."},
  {id:42, name:"Mosque-Library of Turnovo", year:1877, cause: "war", lat:43.07, lon:25.62, loc:"Turnovo, Bulgaria", perp:"Christian Bulgarian forces", desc:"During the Russo-Turkish War and Bulgaria's liberation, a mosque containing a library of Turkish and Ottoman texts was burned. The books were destroyed alongside the mosque as a symbolic act of the religious and political transformation sweeping the region."},
  {id:43, name:"Birmingham Central Library", year:1879, cause:"fire", lat:52.48, lon:-1.9, loc:"Birmingham, UK", perp:"Accidental fire during building works", desc:"A fire broke out behind a wooden partition serving as a temporary wall during building renovations in January 1879, destroying much of the Birmingham Central Library's collection. Thousands of volumes of local history, rare books, and reference works were lost before the fire could be contained."},
  {id:44, name:"Royal Library of Burma", year:1885, cause:"war", lat:21.96, lon:96.08, loc:"Mandalay Palace, Burma", perp:"British Army", desc:"British troops looted the royal palace at the end of the Third Anglo-Burmese War, dispersing the royal library's parabaik manuscripts — hand-painted books recording Burmese history, religion, and art. Much ended up in British museums, where portions remain today."},
  {id:45, name:"University of Virginia Library", year:1895, cause:"fire", lat:38.03, lon:-78.5, loc:"Charlottesville, Virginia, USA", perp:"Accidental fire", desc:"The University of Virginia Library, housed in the Rotunda designed by Thomas Jefferson, was severely damaged by fire in October 1895. The fire destroyed the Annex and damaged Jefferson's original Rotunda building. Thousands of irreplaceable books and manuscripts, including early Americana, were lost in the blaze."},
  {id:46, name:"Hanlin Academy Library", year:1900, cause: "war", lat:39.91, lon:116.39, loc:"Beijing, China", perp:"Boxer Uprising / disputed", desc:"China's oldest and most prestigious literary institution burned during the Boxer Uprising. Western diplomats in the nearby Legation Quarter reportedly watched it burn, unwilling to risk soldiers to save Chinese books. The Academy held an encyclopedia of over 11,000 volumes covering centuries of Chinese history."},
  {id:47, name:"New York State Library", year:1911, cause:"fire", lat:42.65, lon:-73.75, loc:"Albany, New York, USA", perp:"Capitol building fire", desc:"A fire in the New York State Capitol building in March 1911 destroyed the State Library, one of the most important research collections in America. Around 450,000 books and thousands of manuscripts were destroyed, including irreplaceable records of early American history and the complete collection of manuscripts once owned by Benjamin Franklin."},
  {id:48, name:"Catholic University of Leuven", year:1914, cause:"war", lat:50.88, lon:4.7, loc:"Leuven, Belgium", perp:"German Occupation Forces", desc:"German troops systematically burned the medieval library as collective punishment. 300,000 volumes including irreplaceable medieval manuscripts were destroyed. Rebuilt with international donations — then burned again by Germany in 1940. The same country, the same library, twice in 26 years."},
  {id:49, name:"Public Records Office of Ireland", year:1922, cause: "war", lat:53.35, lon:-6.27, loc:"Dublin, Ireland", perp:"Anti-Treaty IRA / Irish Civil War", desc:"The Four Courts complex held Ireland's primary archive going back to medieval times. An explosion during the Civil War destroyed 1,000 years of Irish legal and genealogical records. The paper memory of a nation, gone in an instant."},
  {id:50, name:"University of Tokyo Library", year:1923, cause:"fire", lat:35.71, lon:139.76, loc:"Tokyo, Japan", perp:"Great Kanto Earthquake and fire", desc:"The catastrophic Great Kanto Earthquake of 1923 and the firestorms that followed destroyed the University of Tokyo Library. The collection included the Max Muller Library of South Asian texts and the Nishimura collection of rare Japanese historical documents — irreplaceable primary sources for Asian studies."},
  {id:51, name:"Several Religious Libraries, Madrid", year:1931, cause: "war", lat:40.42, lon:-3.7, loc:"Madrid, Republican Spain", perp:"Anarchists & anti-clericalists", desc:"In 1931, radical leftists burned several churches and their associated libraries across Madrid. Ecclesiastical collections accumulated over centuries were destroyed in a wave of anti-clerical violence that foreshadowed the coming civil war."},
  {id:52, name:"National Library of Nicaragua", year:1931, cause:"fire", lat:12.14, lon:-86.28, loc:"Nicaragua", perp:"1931 Managua earthquake and fire", desc:"The National Library of Nicaragua was damaged in the catastrophic 1931 Managua earthquake and the fires that followed. A second earthquake in 1972 caused further damage. The repeated natural disasters left the national library's collection severely depleted, representing a significant loss of Nicaraguan historical and literary heritage."},
  {id:53, name:"Oriental Library, Shanghai", year:1932, cause:"war", lat:31.23, lon:121.47, loc:"Shanghai, China", perp:"Imperial Japanese Army", desc:"Japanese forces deliberately burned the Oriental Library — 450,000 volumes including rare Song dynasty texts. One of China's largest libraries, its destruction was recognized internationally as a deliberate cultural atrocity."},
  {id:54, name:"Institut fuer Sexualwissenschaft", year:1933, cause:"govt", lat:52.52, lon:13.38, loc:"Berlin, Germany", perp:"Deutsche Studentenschaft / Nazi regime", desc:"Magnus Hirschfeld's pioneering institute — holding the world's most comprehensive research on gender and sexuality — was ransacked and burned. The footage became the defining image of Nazi censorship. It set LGBTQ+ scholarship back by decades."},
  {id:55, name:"University of Oviedo Library", year:1934, cause: "war", lat:43.36, lon:-5.85, loc:"Oviedo, Spain", perp:"Revolutionaries / disputed", desc:"During the Asturian miners' strike of 1934, the University of Oviedo was caught between revolutionary miners and government forces. The library, containing collections of regional history and medieval Asturian manuscripts, was badly damaged in the crossfire."},
  {id:56, name:"Chinese University Libraries (WWII)", year:1937, cause:"war", lat:30, lon:114, loc:"Multiple cities, China", perp:"Imperial Japanese Army", desc:"During the Second Sino-Japanese War, Japanese forces destroyed or severely damaged the libraries of National Tsing Hua University, Nankai University, and numerous other institutions. The systematic destruction of Chinese intellectual infrastructure was deliberate policy."},
  {id:57, name:"National Library of Serbia", year:1941, cause:"war", lat:44.82, lon:20.46, loc:"Belgrade, Yugoslavia", perp:"Nazi German Luftwaffe", desc:"Bombed on Hitler's direct orders on Easter Sunday, 1941. The library held the largest collection of Serbian medieval manuscripts. Over 350,000 books incinerated overnight. The Nazis understood that destroying records is a form of destroying a people."},
  {id:58, name:"SS. Cyril and Methodius National Library", year:1943, cause:"war", lat:42.7, lon:23.32, loc:"Sofia, Bulgaria", perp:"Allied air forces", desc:"The national library sustained severe damage during Allied bombing raids in 1943-1944. Among the significant cultural casualties: rare Bulgarian manuscripts and Ottoman-era documents irreplaceable to Balkan history."},
  {id:59, name:"National Library of Peru", year:1943, cause:"fire", lat:-12.06, lon:-77.04, loc:"Lima, Peru", perp:"Accidental fire", desc:"The National Library of Peru, founded by independence hero Jose de San Martin in 1821, was severely damaged by fire in May 1943. Thousands of colonial-era manuscripts, rare books, and historical documents tracing Peru's history from pre-Columbian times through independence were destroyed. The loss was considered a national catastrophe."},
  {id:60, name:"Krasinski Library, Warsaw", year:1944, cause:"govt", lat:52.25, lon:21, loc:"Warsaw, Poland", perp:"Nazi German troops", desc:"After suppressing the Warsaw Uprising, Nazi troops burned Warsaw library by library — a systematic campaign to erase Polish cultural identity. Over a million volumes from the National Library's special collections destroyed."},
  {id:61, name:"Library of the Zamoyski Family", year:1944, cause:"govt", lat:52.24, lon:21.01, loc:"Warsaw, Poland", perp:"Nazi German troops", desc:"The Zamoyski Family library housed the collections of the former Zamoyski Academy and was one of Poland's great private scholarly libraries. Deliberately set ablaze by Nazi troops in the aftermath of the Warsaw Uprising."},
  {id:62, name:"Central Archives of Historical Records", year:1944, cause:"govt", lat:52.245, lon:21.015, loc:"Warsaw, Poland", perp:"Nazi German troops", desc:"Nazi troops systematically burned the Central Archives after the Warsaw Uprising. They held centuries of Polish administrative, legal, and historical records. Their destruction was deliberate policy — the erasure of the documentary basis of Polish statehood."},
  {id:63, name:"Private Libraries of Tokyo", year:1945, cause:"war", lat:35.69, lon:139.69, loc:"Tokyo, Japan", perp:"US Army Air Force firebombing", desc:"US firebombing of Tokyo in 1945 consumed vast swathes of the city, destroying many private Japanese libraries and local collections. The raids eliminated irreplaceable collections of Japanese literature, family records, and local history."},
  {id:64, name:"Warsaw Public Library", year:1945, cause:"govt", lat:52.23, lon:21.03, loc:"Warsaw, Poland", perp:"Nazi German troops", desc:"Before World War II the library contained 500,000 books. By 1945, after systematic Nazi destruction during and after the Warsaw Uprising, it was reduced to rubble — part of the broader plan to permanently eliminate Polish cultural identity."},
  {id:65, name:"Raczynski Library, Poznan", year:1945, cause:"govt", lat:52.41, lon:16.93, loc:"Poznan, Poland", perp:"Nazi German troops", desc:"Retreating Nazi troops planted explosives in the building and detonated them, destroying much of this important Polish library. The Raczynski had survived the earlier occupation largely intact, making its deliberate destruction in the final days of war a particularly calculated act."},
  {id:66, name:"Jewish Theological Seminary Library", year:1966, cause:"fire", lat:40.81, lon:-73.96, loc:"New York City, USA", perp:"Accidental fire", desc:"A fire in April 1966 at the Jewish Theological Seminary of America destroyed or severely damaged thousands of volumes from one of the world's most important collections of Judaica. Rare Hebrew manuscripts, incunabula, and irreplaceable documents of Jewish intellectual and religious history were among the losses."},
  {id:67, name:"Lebanese National Library", year:1975, cause: "war", lat:33.89, lon:35.5, loc:"Beirut, Lebanon", perp:"Lebanese Civil War", desc:"Caught in the downtown front lines, shelled to a shell. 200,000 volumes destroyed including much of Lebanon's Ottoman-era historical record. The roofless building stood for 25 years before partial restoration."},
  {id:68, name:"National Library of Cambodia", year:1976, cause:"govt", lat:11.57, lon:104.93, loc:"Phnom Penh, Cambodia", perp:"Khmer Rouge", desc:"The Khmer Rouge burned most collections and converted the building into a pigsty. Only 20% of materials survived. Year Zero ideology targeted libraries as the physical embodiment of a past the regime needed to abolish."},
  {id:69, name:"Jaffna Public Library", year:1981, cause:"war", lat:9.66, lon:80.01, loc:"Jaffna, Sri Lanka", perp:"Government-aligned mob and police", desc:"One of Asia's largest libraries — 97,000 volumes including irreplaceable Tamil manuscripts. Its burning is still cited as the moment the Sri Lankan civil war became inevitable: a cultural assassination that made political resolution impossible."},
  {id:70, name:"Sikh Reference Library", year:1984, cause:"war", lat:31.62, lon:74.88, loc:"Punjab, India", perp:"Indian Army (Operation Blue Star)", desc:"During the storming of the Golden Temple complex, the Reference Library — holding rare Sikh manuscripts going back centuries — was looted. The Indian government denied it for years. Much has never been returned."},
  {id:71, name:"Dalhousie University Law Library", year:1985, cause:"fire", lat:44.63, lon:-63.59, loc:"Halifax, Nova Scotia, Canada", perp:"Lightning strike (electrical)", desc:"A lightning strike in August 1985 caused a short circuit that started a fire at the Dalhousie University Law Library. The fire destroyed significant portions of the legal collection, including rare Canadian legal texts and historical case records. It remains one of the most significant accidental library losses in Canadian history."},
  {id:72, name:"Los Angeles Central Library", year:1986, cause:"fire", lat:34.05, lon:-118.26, loc:"Los Angeles, California, USA", perp:"Arson (suspected)", desc:"Two fires in 1986 — the second while the building was under repair from the first — destroyed or damaged around 400,000 books at the Los Angeles Central Library. The first fire in April was one of the largest library fires in US history. A massive volunteer effort helped salvage and restore portions of the collection over subsequent years."},
  {id:73, name:"Academy of Sciences Library, Leningrad", year:1988, cause:"fire", lat:59.94, lon:30.3, loc:"Leningrad, USSR", perp:"Accidental fire", desc:"A fire in February 1988 at the Library of the USSR Academy of Sciences in Leningrad damaged around 400,000 volumes and destroyed approximately 4,000 rare manuscripts. The library, one of the oldest and largest in Russia, had survived the Siege of Leningrad during World War II only to fall victim to an accidental fire during renovation work."},
  {id:74, name:"Central University Library of Bucharest", year:1989, cause: "war", lat:44.43, lon:26.1, loc:"Bucharest, Romania", perp:"Romanian Land Forces", desc:"Set on fire during the Romanian Revolution in December 1989 amid fighting that accompanied the fall of Ceausescu's regime. Hundreds of thousands of volumes were destroyed, including irreplaceable Romanian historical documents accumulated over more than a century."},
  {id:75, name:"Oriental Institute, Sarajevo", year:1992, cause: "war", lat:43.86, lon:18.41, loc:"Sarajevo, Bosnia", perp:"Bosnian Serb Army", desc:"Held the world's largest collection of Islamic manuscripts in the Balkans — 5,263 manuscripts spanning Ottoman history. Destroyed by deliberate shelling as part of a systematic campaign of cultural genocide."},
  {id:76, name:"National Library of Bosnia and Herzegovina", year:1992, cause: "war", lat:43.85, lon:18.42, loc:"Sarajevo, Bosnia", perp:"Bosnian Serb Army", desc:"Over 2 million books. Deliberately shelled for three days until it collapsed in flames. Citizens formed human chains under sniper fire to rescue books. Librarian Aida Buturovc was killed doing so."},
  {id:77, name:"Abkhazian Research Institute Library", year:1992, cause: "war", lat:43, lon:41.02, loc:"Sukhumi, Abkhazia", perp:"Georgian Armed Forces", desc:"The Abkhazian Research Institute and National Library were destroyed during the War in Abkhazia in October 1992. The destruction eliminated the primary repository of Abkhazian cultural heritage, including unique manuscripts documenting the history and language of the Abkhaz people."},
  {id:78, name:"Norwich Central Library", year:1994, cause:"fire", lat:52.63, lon:1.3, loc:"Norwich, England, UK", perp:"Electrical fault (accidental)", desc:"Norwich Central Library caught fire in August 1994 due to an electrical fault, destroying the building and most of its contents. Thousands of books, local history archives, and reference collections were lost. The library had served the community for decades and its rebuilding became a symbol of civic renewal."},
  {id:79, name:"City Library, Linkoping", year:1996, cause:"fire", lat:58.41, lon:15.62, loc:"Linkoping, Sweden", perp:"Arson (perpetrator unidentified)", desc:"After a year of repeated arson attempts against an LGBTQ+ information bureau operating from the building, the Linkoping city library was burned down in September 1996. No one was ever convicted, making it one of Sweden's most significant unsolved cultural attacks."},
  {id:80, name:"Pol-i-Khomri Public Library", year:1998, cause:"religion", lat:35.95, lon:68.71, loc:"Pol-i-Khomri, Afghanistan", perp:"Taliban", desc:"55,000 books and manuscripts. Burned as part of the Taliban's systematic destruction of secular knowledge across Afghanistan. This destruction received almost no international coverage at the time."},
  {id:81, name:"Iraq National Library and Archive", year:2003, cause: "war", lat:33.34, lon:44.39, loc:"Baghdad, Iraq", perp:"Looters amid US invasion", desc:"In the chaos of the 2003 invasion, the National Library was looted and burned. Cuneiform tablets, Ottoman manuscripts, and 450,000 books were lost. US forces had been warned in advance by scholars but failed to protect cultural sites."},
  {id:82, name:"Libraries Damaged in 2004 Indian Ocean Tsunami", year:2004, cause:"fire", lat:3.32, lon:95.85, loc:"Indonesia, Malaysia, Maldives, Thailand, Sri Lanka", perp:"2004 Indian Ocean earthquake and tsunami", desc:"The catastrophic 2004 Indian Ocean earthquake and tsunami caused widespread damage to libraries, archives, and museums across multiple countries. Local libraries, school collections, and municipal archives were swept away or inundated across coastal communities in Indonesia, Thailand, Sri Lanka, and the Maldives, destroying records of local history, culture, and community life."},
  {id:83, name:"Duchess Anna Amalia Library", year:2004, cause:"fire", lat:50.98, lon:11.33, loc:"Weimar, Germany", perp:"Accidental electrical fault", desc:"Goethe's library — one of the most important repositories of German literary heritage, serving Goethe, Schiller, and Herder — was devastated by an accidental electrical fire in September 2004. Around 50,000 books were destroyed and 35,000 damaged. In a rare hopeful story, volunteers formed a human chain through the night passing burning books to safety. The library was restored and reopened in 2007."},
  {id:84, name:"People's Library, Occupy Wall Street", year:2011, cause:"govt", lat:40.71, lon:-74.01, loc:"New York City, USA", perp:"NYC Dept. of Sanitation", desc:"The People's Library at Occupy Wall Street had catalogued over 5,500 donated books. When the NYPD cleared Zuccotti Park in November 2011, the library was seized and most books destroyed or rendered unusable. The first significant library destruction on American soil in nearly two centuries. Books were loaded into sanitation trucks and later found damaged at a city facility; a court subsequently found the city liable."},
  {id:85, name:"Egyptian Scientific Institute", year:2011, cause: "war", lat:30.05, lon:31.25, loc:"Cairo, Egypt", perp:"Egyptian Revolution street violence", desc:"A fire during the revolution spread to the 200-year-old institute. Of 200,000 volumes, only 30,000 were saved. Among the losses: one of only 21 surviving copies of Napoleon's Description de l'Egypte — irreplaceable."},
  {id:86, name:"Ahmed Baba Institute, Timbuktu", year:2013, cause:"religion", lat:16.77, lon:-3, loc:"Timbuktu, Mali", perp:"Islamist militias (AQIM)", desc:"Retreating militants set fire to the institute in January 2013. Early reports said its whole collection was lost, and headlines worldwide repeated it. The reality was far better: librarian Abdel Kader Haidara and Timbuktu residents had already smuggled the bulk of the manuscripts out in trunks and rice sacks. Of roughly 30,000 held there, an estimated 2,000 burned. The rescue, not the loss, is the story."},
  {id:87, name:"Ratanda Public Library", year:2013, cause: "war", lat:-26.48, lon:28.08, loc:"Lesedi Municipality, South Africa", perp:"Public riots", desc:"Burned during public service delivery riots in March 2013. 1,807 books destroyed along with computers and all technological infrastructure. A tragic irony in a community where access to books was already severely limited."},
  {id:88, name:"Fisheries and Oceans Canada Libraries", year:2013, cause:"govt", lat:45.42, lon:-75.7, loc:"Canada", perp:"Harper Government", desc:"Seven of nine Fisheries and Oceans libraries closed and collections discarded to save $443,000 Canadian. Scientists called it data destruction. Research built over 50 years thrown away and irreplaceable."},
  {id:89, name:"Saeh Library, Tripoli", year:2014, cause:"religion", lat:34.44, lon:35.84, loc:"Tripoli, Lebanon", perp:"Unknown (sectarian attack)", desc:"The Christian Saeh Library, containing over 80,000 manuscripts and books, was burned down in January 2014 in a widely condemned sectarian attack. Its founder described standing in the ashes of his life's work. The attack prompted solidarity across all of Lebanon's religious communities."},
  {id:90, name:"National Archives of Bosnia (partial)", year:2014, cause: "war", lat:43.855, lon:18.405, loc:"Sarajevo, Bosnia", perp:"Bosnian rioters", desc:"During the 2014 unrest in Bosnia, large amounts of historical documents were destroyed when rioters set fire to the National Archives building. The archives contained irreplaceable Ottoman-era records central to the pre-war history of the country."},
  {id:91, name:"Mosul University Libraries", year:2014, cause:"religion", lat:36.34, lon:43.13, loc:"Mosul, Iraq", perp:"ISIS / ISIL", desc:"Systematic public book burnings across Mosul — the university library, the museum library, and countless private collections. Rare manuscripts and maps going back centuries burned as tools of infidelity and filmed as propaganda."},
  {id:92, name:"Libraries of Al Anbar Governorate", year:2014, cause:"religion", lat:33.42, lon:43.3, loc:"Al Anbar, Iraq", perp:"ISIS / ISIL", desc:"ISIS extended its systematic book burning campaign across the Al Anbar Governorate in late 2014, destroying libraries in towns and cities throughout the region. Local collections, school libraries, and private archives accumulated over generations were burned as part of the campaign to obliterate pre-Islamic and non-Salafi knowledge."},
  {id:93, name:"Glasgow School of Art Library", year:2014, cause:"fire", lat:55.87, lon:-4.26, loc:"Glasgow, Scotland, UK", perp:"Accidental fire (twice)", desc:"The Mackintosh Library inside Charles Rennie Mackintosh's iconic Glasgow School of Art building was badly damaged by fire in May 2014, and then almost completely destroyed by a second fire in June 2018 while restoration work was underway. The double loss of one of the world's finest examples of Art Nouveau architecture and its library is considered one of the greatest cultural tragedies in modern Scottish history."},
  {id:94, name:"INION Library, Moscow", year:2015, cause:"fire", lat:55.67, lon:37.56, loc:"Moscow, Russia", perp:"Accidental fire", desc:"The Institute of Scientific Information on Social Sciences held around 14 million items — one of the world's largest social science collections. A fire in January 2015 spread to 2,000 square metres, destroying an estimated 15% of the collection including irreplaceable 18th and 19th-century periodicals."},
  {id:95, name:"Mosul Public Library", year:2015, cause:"religion", lat:36.33, lon:43.12, loc:"Mosul, Iraq", perp:"ISIS / ISIL", desc:"The Central Public Library of Ninawa held 8,000 rare books and manuscripts — Syriac and Latin printed books from the 16th and 17th centuries, rare Ottoman newspapers. ISIS publicly burned them in February 2015. What could not be burned was bulldozed."},
  {id:96, name:"Mzuzu University Library", year:2015, cause:"fire", lat:-11.46, lon:34.02, loc:"Mzuzu, Malawi", perp:"Accidental fire", desc:"The Mzuzu University Library in Malawi caught fire in the early hours of December 18, 2015, and was completely destroyed. The entire book collection, computer equipment, and institutional archives were lost. For a developing nation with limited resources for rebuilding, the loss represented a severe setback to higher education in northern Malawi."},
  {id:97, name:"Howard College Law Library", year:2016, cause: "war", lat:-29.87, lon:30.98, loc:"Durban, South Africa", perp:"FeesMustFall protestors", desc:"The law library at Howard College, University of KwaZulu-Natal, was burned by protestors during the FeesMustFall movement in September 2016. Early Roman-Dutch law texts and rare legal manuscripts were among the losses — an unintended casualty of a movement fighting for access to education."},
  {id:98, name:"National Museum of Brazil Library", year:2018, cause:"fire", lat:-22.91, lon:-43.22, loc:"Rio de Janeiro, Brazil", perp:"Accidental fire (electrical)", desc:"A catastrophic fire on September 2, 2018 destroyed the National Museum of Brazil and its library — the country's oldest and most important natural history museum, founded in 1818. An estimated 20 million items were lost, including priceless indigenous cultural artefacts, palaeontological specimens, and a library of rare manuscripts. Brazil's scientific and cultural heritage was devastated."},
  {id:99, name:"Jagger Library, Cape Town (partial)", year:2021, cause:"fire", lat:-33.96, lon:18.46, loc:"Cape Town, South Africa", perp:"Table Mountain wildfire", desc:"The 2021 Table Mountain fire partially destroyed the Jagger Library at the University of Cape Town, including the African Studies collection — one of the most important repositories of African history and scholarship on the continent. Thousands of rare books, photographs, and archival materials documenting African history were lost in the fire that swept through the campus."},
  {id:100, name:"Korolenko State Scientific Library", year:2022, cause:"war", lat:49.99, lon:36.23, loc:"Kharkiv, Ukraine", perp:"Russian bombardment", desc:"One of Ukraine's largest and oldest research libraries, damaged during the bombardment of Kharkiv. It is among the library sites UNESCO has formally verified as damaged in the war."},
  {id:101, name:"Central City Library, Mariupol", year:2022, cause:"war", lat:47.1, lon:37.54, loc:"Mariupol, Ukraine", perp:"Russian bombardment", desc:"The V.G. Korolenko Central City Library was destroyed during the siege of Mariupol. UNESCO lists it among verified damaged cultural sites."},
  {id:102, name:"Kherson Regional Scientific Library", year:2022, cause:"war", lat:46.64, lon:32.61, loc:"Kherson, Ukraine", perp:"Russian forces", desc:"The Kherson Regional Universal Scientific Library was damaged during the occupation and shelling of the city. A branch of the Kherson Regional State Archive was also damaged, one of five archives on UNESCO's verified list."},
  {id:103, name:"Ukrainian Libraries (UNESCO-verified)", year:2022, cause:"war", lat:49.0, lon:32.0, loc:"Ukraine, multiple regions", perp:"Russian armed forces", desc:"As of 29 September 2026 UNESCO had verified damage to 563 Ukrainian cultural sites, including 24 libraries and 5 archives, across the Chernihiv, Kharkiv, Donetsk, Luhansk, Kherson, Sumy, Zaporizhzhia, Dnipropetrovsk and Kyiv regions. A regional record covering many separate institutions rather than one building."},
  {id:104, name:"Azizia Madrasa Library", year:2023, cause: "war", lat:25.18, lon:85.52, loc:"Bihar Sharif, India", perp:"Ram Navami rioters", desc:"The library contained around 4,500 works that were all lost when it was set on fire during Ram Navami riots in March 2023. Among the losses were rare Islamic manuscripts and texts accumulated over generations at this historic madrasa in Bihar."},
  {id:105, name:"Diana Tamari Sabbagh Library", year:2023, cause:"war", lat:31.5, lon:34.46, loc:"Gaza City, Palestine", perp:"Israeli military airstrike", desc:"The Diana Tamari Sabbagh Library and the Rashad Shawa Cultural Center that housed it were destroyed by an airstrike in November 2023. The library held collections documenting Palestinian literary and cultural heritage. Its destruction was part of the broader devastation of Gaza's cultural infrastructure."},
  {id:106, name:"Edward Said Public Library", year:2023, cause:"war", lat:31.55, lon:34.5, loc:"Beit Lahia, Palestine", perp:"Israeli military", desc:"The Edward Said Public Library in Beit Lahia was destroyed during the Gaza war. Named after the Palestinian-American intellectual, the library held collections serving the local community and preserving Palestinian cultural memory accumulated over generations."},
  {id:107, name:"Gaza Libraries Combined (2023-24)", year:2023, cause:"war", lat:31.505, lon:34.47, loc:"Gaza, Palestine", perp:"Israeli military", desc:"Beyond the Diana Tamari Sabbagh Library and Edward Said Public Library, numerous smaller libraries, school collections, university archives, and community reading rooms across Gaza were destroyed during the 2023-2024 conflict. The collective destruction represents a systematic loss of Palestinian documentary heritage and the erasure of cultural memory spanning generations."},
  {id:108, name:"Islamic University of Gaza Library", year:2023, cause:"war", lat:31.5, lon:34.45, loc:"Gaza City, Palestine", perp:"Israeli airstrikes", desc:"The largest academic library in Gaza, holding a reported 1.5 million volumes alongside academic journals, rare documents and historical manuscripts. The university and its library were destroyed during the bombardment that began in late 2023."},
  {id:109, name:"Great Omari Mosque Library", year:2023, cause:"war", lat:31.504, lon:34.464, loc:"Gaza City, Palestine", perp:"Israeli airstrikes", desc:"Attached to Gaza's oldest mosque and among the most important libraries in Palestine. Its rare books had survived the Crusades and the First World War before being destroyed in an airstrike. Volunteers began sorting salvageable fragments inside the ruined library in February 2026."},
  {id:110, name:"Central Archives of Gaza City", year:2023, cause:"war", lat:31.508, lon:34.452, loc:"Gaza City, Palestine", perp:"Israeli bombardment", desc:"Destroyed in December 2023 along with thousands of historically significant documents. The Ottoman-era records held there were entirely destroyed and none were recovered during later excavation, a complete erasure of several centuries of municipal and legal memory."},
  {id:111, name:"Mohamed Omer Bashir Centre Library", year:2023, cause: "war", lat:15.64, lon:32.48, loc:"Omdurman, Sudan", perp:"Sudanese civil war combatants", desc:"The library of the Mohamed Omer Bashir Centre for Sudanese Studies at Omdurman Ahlia University was burned in May 2023. It held original documents on Sudanese political and cultural history. The centre's head believed it was targeted deliberately to harm the university."},
  {id:112, name:"Sudan National Records Office and Sudan Library", year:2023, cause: "war", lat:15.5, lon:32.56, loc:"Khartoum, Sudan", perp:"Rapid Support Forces / Sudanese Armed Forces", desc:"Sudan's National Archives and National Library both sustained heavy damage during the fighting for Khartoum. Members of the Sudanese Writers Union have argued that the wider destruction of the country's heritage was intended to erase its history."},
  {id:113, name:"EBAF Archives, Gaza", year:2025, cause:"war", lat:31.52, lon:34.44, loc:"Rimal, Gaza City, Palestine", perp:"Israeli airstrike", desc:"On 14 September 2025 an airstrike hit the building housing the archives of the Ecole biblique et archeologique francaise, destroying research materials gathered over decades of excavation across the region."},
  {id:114, name:"Sudan University College of Forestry Library", year:2026, cause: "war", lat:15.55, lon:32.53, loc:"Khartoum, Sudan", perp:"Rapid Support Forces", desc:"In February 2026 Sudan University of Science and Technology officials reported that the College of Forestry library had been burned, along with musical instruments, used as fuel. The university reported 258 million dollars in total war losses."}
];

var ERAS = [
  {l:"All eras",              a:-3000, b:3000},
  {l:"Ancient (to 500 AD)",   a:-3000, b:500},
  {l:"Early Med. (500–1000)", a:500,   b:1000},
  {l:"High Med. (1000–1400)", a:1000,  b:1400},
  {l:"Early Mod. (1400–1700)",a:1400,  b:1700},
  {l:"Enlighten. (1700–1850)",a:1700,  b:1850},
  {l:"Industrial (1850–1914)",a:1850,  b:1914},
  {l:"World Wars (1914–1950)",a:1914,  b:1950},
  {l:"Cold War (1950–2000)",  a:1950,  b:2000},
  {l:"21st century (2000+)",  a:2000,  b:3000}
];

/* Records that describe a whole country/region rather than one building.
   These get a dashed ring so the pin is not read as a precise address. */
var APPROX = {28:1,39:1,56:1,63:1,82:1,88:1,92:1,103:1,107:1};

/* ============ PROJECTION ============ */
/* Equirectangular. World space is 0..2000 x 0..1000. */
var W = 2000, H = 1000;
function px(lon){ return (lon + 180) / 360 * W; }
function py(lat){ return (90 - lat) / 180 * H; }

/* ============ VIEW (pan / zoom via viewBox) ============ */
var view = {x:0, y:0, w:W, h:H};
var svg  = document.getElementById("map");
var stage= document.getElementById("stage");

function applyView(){
  svg.setAttribute("viewBox", view.x+" "+view.y+" "+view.w+" "+view.h);
}
function dataBounds(){
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  LIBRARIES.forEach(function(d){
    if(d._x<x0)x0=d._x; if(d._x>x1)x1=d._x;
    if(d._y<y0)y0=d._y; if(d._y>y1)y1=d._y;
  });
  var padX=(x1-x0)*0.07, padY=(y1-y0)*0.14;
  return {x0:x0-padX, y0:y0-padY, x1:x1+padX, y1:y1+padY};
}
function fitBox(b){
  var r = stage.getBoundingClientRect();
  var aspect = r.width / r.height;
  var bw = b.x1-b.x0, bh = b.y1-b.y0;
  var w = bw, h = bw/aspect;
  if (h < bh){ h = bh; w = bh*aspect; }
  view.w = w; view.h = h;
  view.x = (b.x0+b.x1)/2 - w/2;
  view.y = (b.y0+b.y1)/2 - h/2;
  applyView();
}
function dataCentre(){
  var xs = LIBRARIES.map(function(d){return d._x;}).sort(function(a,b){return a-b;});
  var ys = LIBRARIES.map(function(d){return d._y;}).sort(function(a,b){return a-b;});
  var m = Math.floor(xs.length/2);
  return {x:xs[m], y:ys[m]};   /* median — sits in the dense Europe/Levant band */
}
function fitInitial(){
  var r = stage.getBoundingClientRect();
  var aspect = r.width / r.height;
  var b = dataBounds();
  if (aspect < 0.85){
    /* Tall screen: filling the box would leave the map a thin strip.
       Fill vertically around the densest cluster instead; pan for the rest. */
    var h = (b.y1 - b.y0) * 1.45;
    var w = h * aspect;
    var c = dataCentre();
    view.w = w; view.h = h;
    view.x = c.x - w/2;
    view.y = c.y - h/2;
    applyView();
  } else {
    fitBox(b);
  }
}

function fitWorld(){ fitBox({x0:0,y0:0,x1:W,y1:H}); }

function zoomBy(f, cx, cy){
  if (cx === undefined) { cx = view.x + view.w/2; cy = view.y + view.h/2; }
  var nw = view.w / f, nh = view.h / f;
  var minW = W/60, maxW = W*2.2;
  if (nw < minW || nw > maxW) return;
  view.x = cx - (cx - view.x) * (nw / view.w);
  view.y = cy - (cy - view.y) * (nh / view.h);
  view.w = nw; view.h = nh;
  applyView();
}
function clientToWorld(clientX, clientY){
  var r = stage.getBoundingClientRect();
  return {
    x: view.x + (clientX - r.left) / r.width  * view.w,
    y: view.y + (clientY - r.top)  / r.height * view.h
  };
}

/* ---- pointer handling: 1 finger pans, 2 fingers pinch-zoom ---- */
var pointers = {};        /* active pointers by id */
var panStart = null;      /* single-finger pan anchor */
var pinch = null;         /* two-finger gesture state */
var lastTap = 0;

function ptList(){
  var a = []; for (var k in pointers) a.push(pointers[k]); return a;
}
function dist(a,b){
  var dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy);
}
function mid(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }

stage.addEventListener("pointerdown", function(e){
  if (e.target.closest(".mk")) return;
  pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
  try { stage.setPointerCapture(e.pointerId); } catch(err){}

  var p = ptList();
  if (p.length === 1){
    panStart = {sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y};
    pinch = null;
    /* double-tap to zoom in */
    var now = Date.now();
    if (now - lastTap < 300){
      var w = clientToWorld(e.clientX, e.clientY);
      zoomBy(1.8, w.x, w.y);
      lastTap = 0;
    } else lastTap = now;
  } else if (p.length === 2){
    panStart = null;
    var m = mid(p[0], p[1]);
    pinch = {
      d: dist(p[0], p[1]),
      world: clientToWorld(m.x, m.y),
      w: view.w, h: view.h
    };
  }
  stage.classList.add("dragging");
});

stage.addEventListener("pointermove", function(e){
  if (!(e.pointerId in pointers)) return;
  pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
  var p = ptList();
  var r = stage.getBoundingClientRect();

  if (p.length >= 2 && pinch){
    var nd = dist(p[0], p[1]);
    if (nd < 8) return;
    var scale = nd / pinch.d;
    var nw = pinch.w / scale, nh = pinch.h / scale;
    var minW = W/60, maxW = W*2.2;
    if (nw < minW){ nw = minW; nh = minW * (pinch.h/pinch.w); }
    if (nw > maxW){ nw = maxW; nh = maxW * (pinch.h/pinch.w); }
    var m = mid(p[0], p[1]);
    var fx = (m.x - r.left) / r.width, fy = (m.y - r.top) / r.height;
    view.w = nw; view.h = nh;
    view.x = pinch.world.x - fx * nw;
    view.y = pinch.world.y - fy * nh;
    applyView();
    e.preventDefault();
  } else if (p.length === 1 && panStart){
    view.x = panStart.vx - (e.clientX - panStart.sx) / r.width  * view.w;
    view.y = panStart.vy - (e.clientY - panStart.sy) / r.height * view.h;
    applyView();
  }
}, {passive:false});

function dropPointer(e){
  delete pointers[e.pointerId];
  var p = ptList();
  if (p.length < 2) pinch = null;
  if (p.length === 1){
    panStart = {sx:p[0].x, sy:p[0].y, vx:view.x, vy:view.y};
  }
  if (p.length === 0){
    panStart = null;
    stage.classList.remove("dragging");
  }
}
stage.addEventListener("pointerup", dropPointer);
stage.addEventListener("pointercancel", dropPointer);
stage.addEventListener("pointerleave", function(e){
  if (e.pointerType === "mouse") dropPointer(e);
});

stage.addEventListener("wheel", function(e){
  e.preventDefault();
  var w = clientToWorld(e.clientX, e.clientY);
  zoomBy(e.deltaY < 0 ? 1.18 : 1/1.18, w.x, w.y);
}, {passive:false});

/* block the browser's own pinch/double-tap so ours is the only zoom */
stage.addEventListener("gesturestart",  function(e){ e.preventDefault(); });
stage.addEventListener("gesturechange", function(e){ e.preventDefault(); });
stage.addEventListener("dblclick",      function(e){ e.preventDefault(); });

document.getElementById("zin").onclick  = function(){ zoomBy(1.6); };
document.getElementById("zout").onclick = function(){ zoomBy(1/1.6); };
document.getElementById("zres").onclick = function(){ fitInitial(); };
document.getElementById("zworld").onclick = function(){ fitWorld(); };

svg.setAttribute("tabindex","0");
svg.addEventListener("keydown", function(e){
  var step = view.w * 0.08;
  if (e.key === "ArrowLeft"){  view.x -= step; applyView(); e.preventDefault(); }
  if (e.key === "ArrowRight"){ view.x += step; applyView(); e.preventDefault(); }
  if (e.key === "ArrowUp"){    view.y -= step; applyView(); e.preventDefault(); }
  if (e.key === "ArrowDown"){  view.y += step; applyView(); e.preventDefault(); }
  if (e.key === "+" || e.key === "="){ zoomBy(1.3); e.preventDefault(); }
  if (e.key === "-"){ zoomBy(1/1.3); e.preventDefault(); }
});
window.addEventListener("resize", fitInitial);

/* ============ DRAW LAND ============ */
var NS = "http://www.w3.org/2000/svg";

function drawLand(){
  var g = document.getElementById("gLand"), frag = document.createDocumentFragment();
  COASTLINES.forEach(function(d){
    var p = document.createElementNS(NS, "path");
    p.setAttribute("d", d);
    p.setAttribute("class", "country");
    frag.appendChild(p);
  });
  g.appendChild(frag);
}

function drawGraticule(){
  var g = document.getElementById("gGrat"), frag = document.createDocumentFragment();
  for (var lon = -180; lon <= 180; lon += 30){
    var l = document.createElementNS(NS,"line");
    l.setAttribute("x1",px(lon)); l.setAttribute("y1",0);
    l.setAttribute("x2",px(lon)); l.setAttribute("y2",H);
    l.setAttribute("class","grat"); frag.appendChild(l);
  }
  for (var lat = -60; lat <= 80; lat += 30){
    var l2 = document.createElementNS(NS,"line");
    l2.setAttribute("x1",0); l2.setAttribute("y1",py(lat));
    l2.setAttribute("x2",W); l2.setAttribute("y2",py(lat));
    l2.setAttribute("class","grat"); frag.appendChild(l2);
  }
  g.appendChild(frag);
}

/* ============ SITES (de-overlap co-located records) ============ */
/* Several records share one city (Warsaw x4, Sarajevo x3, Mosul x3...).
   Group them, then fan the members out so every record stays clickable. */
var SITES = [];
function buildSites(){
  var byKey = {};
  LIBRARIES.forEach(function(d){
    var k = d.lat.toFixed(1) + "," + d.lon.toFixed(1);
    (byKey[k] = byKey[k] || []).push(d);
  });
  Object.keys(byKey).forEach(function(k){
    var members = byKey[k].sort(function(a,b){ return a.year - b.year; });
    var bx = px(members[0].lon), by = py(members[0].lat);
    if (members.length === 1){
      members[0]._x = bx; members[0]._y = by;
    } else {
      var R = 5.2 + members.length * 0.9;
      members.forEach(function(d,i){
        var a = (i / members.length) * Math.PI * 2 - Math.PI/2;
        d._x = bx + Math.cos(a) * R;
        d._y = by + Math.sin(a) * R;
      });
    }
    members.forEach(function(d){ d._site = members; });
    SITES.push(members);
  });
}

/* ============ MARKERS ============ */
var markEls = {};
function radiusFor(year){
  if (year < 0)    return 3.0;
  if (year < 1000) return 3.3;
  if (year < 1700) return 3.7;
  if (year < 1900) return 4.1;
  return 4.6;
}
function drawMarkers(){
  var g = document.getElementById("gMarks"), frag = document.createDocumentFragment();
  LIBRARIES.forEach(function(d){
    var c = CAUSES[d.cause] || {color:"#999", label:"Unknown"};
    var r = radiusFor(d.year);
    var el = document.createElementNS(NS,"g");
    el.setAttribute("class","mk" + (APPROX[d.id] ? " approx" : ""));
    el.setAttribute("tabindex","0");
    el.setAttribute("role","button");
    el.setAttribute("aria-label", d.name + ", " + d.loc + ", " + yr(d.year) + ", " + c.label);

    var halo = document.createElementNS(NS,"circle");
    halo.setAttribute("class","mk-halo");
    halo.setAttribute("cx",d._x); halo.setAttribute("cy",d._y);
    halo.setAttribute("r", r*2.9);
    halo.setAttribute("stroke", c.color);
    halo.setAttribute("stroke-width","1.4");
    el.appendChild(halo);

    var core = document.createElementNS(NS,"circle");
    core.setAttribute("class","mk-core");
    core.setAttribute("cx",d._x); core.setAttribute("cy",d._y);
    core.setAttribute("r", r);
    core.setAttribute("fill", c.color);
    core.setAttribute("fill-opacity", APPROX[d.id] ? ".35" : ".9");
    el.appendChild(core);

    el.addEventListener("click", function(ev){ ev.stopPropagation(); select(d); });
    el.addEventListener("keydown", function(ev){
      if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); select(d); }
    });
    el.addEventListener("pointerenter", function(ev){ showTip(d, ev); });
    el.addEventListener("pointerleave", hideTip);

    markEls[d.id] = el;
    frag.appendChild(el);
  });
  g.appendChild(frag);
}

/* ============ TOOLTIP ============ */
var tip = document.getElementById("tip");
function showTip(d, ev){
  tip.innerHTML = '<div class="n">' + esc(d.name) + '</div><div class="m">' +
                  esc(d.loc) + ' &middot; ' + yr(d.year) + '</div>';
  tip.style.display = "block";
  var r = stage.getBoundingClientRect();
  var x = ev.clientX - r.left + 14, y = ev.clientY - r.top - 10;
  if (x + 240 > r.width) x = ev.clientX - r.left - 240;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip(){ tip.style.display = "none"; }

/* ============ PANEL ============ */
var panel = document.getElementById("panel");
var pin   = document.getElementById("pin");
var selected = null;

function yr(y){ return y < 0 ? Math.abs(y) + " BC" : y + " AD"; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(m){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]; }); }

function select(d){
  if (selected && markEls[selected.id]) markEls[selected.id].classList.remove("sel");
  selected = d;
  var el = markEls[d.id];
  if (el){ el.classList.add("sel"); el.parentNode.appendChild(el); }

  var c = CAUSES[d.cause] || {color:"#999",label:"Unknown"};
  var html =
    '<div class="pb" style="color:'+c.color+';border-color:'+c.color+'">'+c.label+'</div>' +
    '<div class="pt">'+esc(d.name)+'</div>' +
    '<div class="pl">'+esc(d.loc)+' &middot; '+yr(d.year)+'</div>';
  if (APPROX[d.id]) html += '<div class="papprox">Region-wide record &mdash; pin is indicative</div>';
  html += '<div class="pd">'+esc(d.desc)+'</div>' +
          '<div class="pp"><b>Perpetrator</b><span>'+esc(d.perp)+'</span></div>';

  if (d._site && d._site.length > 1){
    html += '<div class="psame"><b>'+(d._site.length-1)+' more at this location</b>';
    d._site.forEach(function(o){
      if (o.id === d.id) return;
      var oc = CAUSES[o.cause] || {color:"#999"};
      html += '<button data-go="'+o.id+'" style="border-color:'+oc.color+'">'+
              esc(o.name)+' &middot; '+yr(o.year)+'</button>';
    });
    html += '</div>';
  }
  pin.innerHTML = html;
  pin.querySelectorAll("[data-go]").forEach(function(b){
    b.onclick = function(){
      var id = +b.getAttribute("data-go");
      var t = LIBRARIES.filter(function(x){ return x.id === id; })[0];
      if (t) select(t);
    };
  });

  panel.classList.add("open");
  panel.setAttribute("aria-hidden","false");

  /* centre on the pin, and zoom in if we are still far out */
  if (view.w > W/5){
    var f = (W/5) / view.w;
    view.w *= f; view.h *= f;
  }
  view.x = d._x - view.w/2;
  view.y = d._y - view.h/2;
  applyView();
}
document.getElementById("pclose").onclick = function(){
  panel.classList.remove("open");
  panel.setAttribute("aria-hidden","true");
  if (selected && markEls[selected.id]) markEls[selected.id].classList.remove("sel");
  selected = null;
};
document.addEventListener("keydown", function(e){
  if (e.key === "Escape") document.getElementById("pclose").click();
});

/* ============ FILTERS ============ */
var fCause = "all", fEra = 0;

function buildCauseButtons(){
  var row = document.getElementById("causeRow");
  function mk(key, label, color){
    var b = document.createElement("button");
    b.className = "fb";
    b.setAttribute("aria-pressed", key === "all" ? "true" : "false");
    b.dataset.k = key;
    b.innerHTML = (color ? '<span class="sw" style="background:'+color+'"></span>' : "") + label;
    b.onclick = function(){
      fCause = key;
      row.querySelectorAll(".fb").forEach(function(x){
        x.setAttribute("aria-pressed", x.dataset.k === key ? "true" : "false");
      });
      applyFilters();
    };
    row.appendChild(b);
  }
  mk("all","All");
  Object.keys(CAUSES).forEach(function(k){ mk(k, CAUSES[k].label, CAUSES[k].color); });
}

function applyFilters(){
  var era = ERAS[fEra], shown = 0, sites = {};
  LIBRARIES.forEach(function(d){
    var ok = (fCause === "all" || d.cause === fCause) &&
             (d.year >= era.a && d.year < era.b);
    var el = markEls[d.id];
    if (el) el.style.display = ok ? "" : "none";
    if (ok){ shown++; sites[d.lat.toFixed(1)+","+d.lon.toFixed(1)] = 1; }
  });
  document.getElementById("sShown").textContent = shown;
  document.getElementById("sSites").textContent = Object.keys(sites).length;
}

document.getElementById("era").addEventListener("input", function(){
  fEra = +this.value;
  document.getElementById("eraOut").textContent = ERAS[fEra].l;
  applyFilters();
});

/* ============ BOOT ============ */
function start(){
  buildSites();
  drawGraticule();
  drawLand();
  drawMarkers();
  fitInitial();
  applyFilters();
}

buildCauseButtons();
if (document.readyState === "complete" || document.readyState === "interactive") start();
else document.addEventListener("DOMContentLoaded", start);
</script>
