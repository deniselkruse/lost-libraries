<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>The Lost Libraries — Geographic Atlas of Erasure</title>
<meta name="description" content="Interactive world map of 108 libraries destroyed across 3,785 years of history.">
<link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;0,600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{background:var(--ink);color:var(--parch);font-family:'Crimson Pro',Georgia,serif;font-size:17px}

  .skip{position:absolute;top:-100px;left:1rem;background:var(--focus);color:#000;padding:.55rem 1.1rem;z-index:9999;
        text-decoration:none;font-family:'Courier Prime',monospace;font-weight:700;font-size:.85rem;border-radius:0 0 4px 4px}
  .skip:focus{top:0}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px}

  /* ---------- MAP STAGE ---------- */
  #stage{position:absolute;inset:0;background:var(--sea);overflow:hidden;cursor:grab;
         touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
  #stage.dragging{cursor:grabbing}
  #map{display:block;width:100%;height:100%;touch-action:none}
  .country{fill:var(--land);stroke:var(--coast);stroke-width:.35;vector-effect:non-scaling-stroke}
  .grat{fill:none;stroke:rgba(18,15,12,.05);stroke-width:.4;vector-effect:non-scaling-stroke}

  .mk{cursor:pointer;vector-effect:non-scaling-stroke}
  .mk:hover .mk-core{stroke:#120f0c;stroke-width:1.6}
  .mk-core{stroke:rgba(18,15,12,.45);stroke-width:.8;vector-effect:non-scaling-stroke}
  .mk.sel .mk-core{stroke:#120f0c;stroke-width:2.2;vector-effect:non-scaling-stroke}
  .mk.approx .mk-core{stroke-dasharray:2.2 1.6}
  .mk-halo{fill:none;opacity:0;transition:opacity .2s}
  .mk.sel .mk-halo{opacity:.55}

  /* ---------- LOADING / ERROR ---------- */
  #boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
        gap:.9rem;background:var(--sea);z-index:50;text-align:center;padding:2rem}
  #boot.hide{display:none}
  .boot-t{font-family:'Courier Prime',monospace;font-size:.75rem;letter-spacing:.25em;text-transform:uppercase;color:var(--gold)}
  .boot-s{font-family:'Crimson Pro',serif;font-style:italic;color:var(--smoke);max-width:420px;line-height:1.7;font-size:1rem}
  .spin{width:26px;height:26px;border:2px solid rgba(18,15,12,.2);border-top-color:var(--ember);border-radius:50%;
        animation:sp .9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- TOP BAR ---------- */
  #top{position:absolute;top:0;left:0;right:0;z-index:20;padding:.9rem 1.1rem 2.6rem;
       background:linear-gradient(180deg,rgba(244,241,234,.97) 0%,rgba(244,241,234,.85) 62%,transparent 100%);
       display:flex;gap:1.2rem;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
  #top > *{pointer-events:auto}
  .brand p{font-family:'Courier Prime',monospace;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:.1rem}
  .brand h1{font-family:'Playfair Display',serif;font-size:clamp(1rem,2.4vw,1.45rem);font-weight:900;line-height:1.05}
  .brand h1 em{font-style:italic;color:var(--ember)}

  .ctrls{display:flex;flex-direction:column;gap:.5rem;flex:1;min-width:230px}
  .row{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
  .lbl{font-family:'Courier Prime',monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--smoke);margin-right:.2rem}
  .fb{font-family:'Courier Prime',monospace;font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;
      padding:.42rem .75rem;border:1px solid rgba(18,15,12,.22);background:rgba(244,241,234,.8);color:var(--smoke);
      cursor:pointer;border-radius:2px;transition:.18s;white-space:nowrap;min-height:30px}
  .fb:hover{border-color:var(--ember);color:var(--parch)}
  .fb[aria-pressed="true"]{color:var(--ember);border-color:var(--ember);background:rgba(168,64,26,.12)}
  .fb .sw{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:.35rem;vertical-align:middle}

  input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:3px;background:rgba(18,15,12,.2);
                    border-radius:2px;outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--ember);border-radius:50%;cursor:pointer}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;background:var(--ember);border:none;border-radius:50%;cursor:pointer}
  #eraOut{font-family:'Courier Prime',monospace;font-size:.66rem;color:var(--ember);min-width:9.5rem}

  /* ---------- ZOOM ---------- */
  #zoom{position:absolute;right:.9rem;bottom:7.4rem;z-index:30;display:flex;flex-direction:column;gap:.4rem}
  .zb{width:46px;height:46px;border:1px solid rgba(18,15,12,.28);background:rgba(244,241,234,.94);color:var(--aged);
      font-size:1.3rem;cursor:pointer;border-radius:3px;line-height:1;
      display:flex;align-items:center;justify-content:center;
      -webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .zb:hover,.zb:active{border-color:var(--ember);color:var(--ember);background:rgba(168,64,26,.12)}
  .zb.sm{font-size:.56rem;letter-spacing:.06em}

  /* ---------- BOTTOM ---------- */
  #bot{position:absolute;bottom:0;left:0;right:0;z-index:20;padding:2.4rem 1.1rem .85rem;
       background:linear-gradient(0deg,rgba(244,241,234,.97) 0%,rgba(244,241,234,.85) 62%,transparent 100%);
       display:flex;gap:1.6rem;align-items:flex-end;flex-wrap:wrap;pointer-events:none}
  #bot > *{pointer-events:auto}
  .stat{text-align:center}
  .stat-n{font-family:'Playfair Display',serif;font-size:1.65rem;font-weight:700;color:var(--ember);line-height:1}
  .stat-l{font-family:'Courier Prime',monospace;font-size:.54rem;letter-spacing:.14em;text-transform:uppercase;color:var(--smoke);margin-top:.15rem}
  .note{margin-left:auto;max-width:300px;text-align:right}
  .note b{display:block;font-family:'Courier Prime',monospace;font-size:.55rem;letter-spacing:.14em;
          text-transform:uppercase;color:var(--smoke);margin-bottom:.22rem;font-weight:400}
  .note span{font-size:.82rem;font-style:italic;color:rgba(18,15,12,.6);line-height:1.5}

  /* ---------- PANEL ---------- */
  #panel{position:absolute;top:0;right:0;bottom:0;width:340px;max-width:100%;background:var(--panel);z-index:40;
         border-left:1px solid rgba(18,15,12,.13);transform:translateX(100%);
         transition:transform .34s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column}
  #panel.open{transform:none}
  #pclose{position:absolute;top:.6rem;right:.6rem;background:none;border:none;color:var(--smoke);
          font-size:1.3rem;cursor:pointer;padding:.25rem .45rem;line-height:1}
  #pclose:hover{color:var(--parch)}
  #pin{overflow-y:auto;padding:1.5rem 1.4rem 2rem;flex:1}
  #pin::-webkit-scrollbar{width:3px}
  #pin::-webkit-scrollbar-thumb{background:var(--ash)}
  .pb{font-family:'Courier Prime',monospace;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;
      padding:.2rem .7rem;border:1px solid;display:inline-block;margin-bottom:.7rem}
  .pt{font-family:'Playfair Display',serif;font-size:1.35rem;line-height:1.2;margin-bottom:.3rem}
  .pl{font-family:'Courier Prime',monospace;font-size:.66rem;color:var(--smoke);margin-bottom:.4rem}
  .papprox{font-family:'Courier Prime',monospace;font-size:.58rem;color:var(--gold);
           border:1px solid rgba(208,160,64,.3);padding:.18rem .5rem;display:inline-block;margin-bottom:1rem}
  .pd{font-size:.97rem;color:var(--aged);line-height:1.85}
  .pp{margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid rgba(18,15,12,.1)}
  .pp b{display:block;font-family:'Courier Prime',monospace;font-size:.55rem;letter-spacing:.2em;
        text-transform:uppercase;color:var(--ember);margin-bottom:.2rem;font-weight:400}
  .pp span{font-size:.9rem;color:var(--smoke)}
  .psame{margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid rgba(18,15,12,.1)}
  .psame b{display:block;font-family:'Courier Prime',monospace;font-size:.55rem;letter-spacing:.2em;
           text-transform:uppercase;color:var(--smoke);margin-bottom:.45rem;font-weight:400}
  .psame button{display:block;width:100%;text-align:left;background:none;border:none;border-left:2px solid;
                padding:.3rem .6rem;margin-bottom:.25rem;color:var(--aged);font-family:'Crimson Pro',serif;
                font-size:.88rem;cursor:pointer}
  .psame button:hover{background:rgba(255,255,255,.04);color:var(--parch)}

  .psrc{margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid rgba(18,15,12,.1)}
  .psrc b{display:block;font-family:'Courier Prime',monospace;font-size:.6rem;
    letter-spacing:.2em;text-transform:uppercase;color:var(--ember);
    margin-bottom:.45rem;font-weight:400}
  .psrc a,.psrc span{display:block;font-size:.88rem;line-height:1.45;
    margin-bottom:.4rem;color:var(--smoke);text-decoration:none;
    border-left:2px solid rgba(18,15,12,.15);padding-left:.6rem}
  .psrc a{color:var(--ember);text-decoration:underline;text-underline-offset:2px}
  .psrc a:hover{color:var(--gold)}

  /* ---------- TOOLTIP ---------- */
  #tip{position:absolute;z-index:45;pointer-events:none;display:none;background:rgba(251,248,242,.97);
       border:1px solid rgba(18,15,12,.2);padding:.42rem .7rem;max-width:230px}
  #tip .n{font-family:'Playfair Display',serif;font-size:.9rem;line-height:1.25}
  #tip .m{font-family:'Courier Prime',monospace;font-size:.6rem;color:var(--smoke);margin-top:.12rem}

  @media(max-width:640px){
    #panel{width:100%}
    #top{padding:.7rem .8rem 2.2rem;gap:.7rem}
    #bot{padding:2rem .8rem .7rem;gap:1rem}
    .note{display:none}
    #zoom{bottom:6.4rem;right:.7rem}
    input[type=range]{width:110px}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a href="#panel" class="skip">Skip to details panel</a>

<div id="stage">
  <svg id="map" role="application" aria-label="World map of destroyed libraries. Use arrow keys to pan, plus and minus to zoom.">
    <g id="gGrat"></g><g id="gLand"></g><g id="gMarks"></g>
  </svg>
</div>

<div id="top">
  <div class="brand">
    <p>Lost Libraries &mdash; Geographic Atlas</p>
    <h1>The Lost <em>Libraries</em></h1>
  </div>
  <div class="ctrls">
    <div class="row" role="group" aria-label="Filter by cause of destruction" id="causeRow">
      <span class="lbl">Cause</span>
    </div>
    <div class="row">
      <span class="lbl">Era</span>
      <input type="range" id="era" min="0" max="9" value="0" aria-label="Filter by historical era">
      <span id="eraOut">All eras</span>
    </div>
  </div>
</div>

<div id="zoom">
  <button class="zb" id="zin"  aria-label="Zoom in">+</button>
  <button class="zb" id="zout" aria-label="Zoom out">&minus;</button>
  <button class="zb sm" id="zres"  aria-label="Reset to default view">RESET</button>
  <button class="zb sm" id="zworld" aria-label="Show whole world">WORLD</button>
</div>

<div id="bot">
  <div class="stat"><div class="stat-n" id="sShown">108</div><div class="stat-l">Shown</div></div>
  <div class="stat"><div class="stat-n" id="sSites">—</div><div class="stat-l">Map Sites</div></div>
  <div class="stat"><div class="stat-n">108</div><div class="stat-l">Total Records</div></div>
  <div class="note">
    <b>A note on the pins</b>
    <span>Pinch or double-tap to zoom. Dashed rings mark records covering a whole region, not one address.</span>
  </div>
</div>

<div id="panel" role="complementary" aria-label="Library details" aria-hidden="true">
  <button id="pclose" aria-label="Close details panel">&#x2715;</button>
  <div id="pin"></div>
</div>

<div id="tip" role="tooltip"></div>

<script src="data.js"></script>

/* Records that describe a whole country/region rather than one building.
   These get a dashed ring so the pin is not read as a precise address. */

/* ============ PROJECTION ============ */
/* Equirectangular. World space is 0..2000 x 0..1000. */
var W = 2000, H = 1000;
function px(lon){ return (lon + 180) / 360 * W; }
function py(lat){ return (90 - lat) / 180 * H; }

/* ============ VIEW (pan / zoom via viewBox) ============ */
var view = {x:0, y:0, w:W, h:H};
var svg  = document.getElementById("map");
var stage= document.getElementById("stage");

function applyView(){
  svg.setAttribute("viewBox", view.x+" "+view.y+" "+view.w+" "+view.h);
}
function dataBounds(){
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  LIBRARIES.forEach(function(d){
    if(d._x<x0)x0=d._x; if(d._x>x1)x1=d._x;
    if(d._y<y0)y0=d._y; if(d._y>y1)y1=d._y;
  });
  var padX=(x1-x0)*0.07, padY=(y1-y0)*0.14;
  return {x0:x0-padX, y0:y0-padY, x1:x1+padX, y1:y1+padY};
}
function fitBox(b){
  var r = stage.getBoundingClientRect();
  var aspect = r.width / r.height;
  var bw = b.x1-b.x0, bh = b.y1-b.y0;
  var w = bw, h = bw/aspect;
  if (h < bh){ h = bh; w = bh*aspect; }
  view.w = w; view.h = h;
  view.x = (b.x0+b.x1)/2 - w/2;
  view.y = (b.y0+b.y1)/2 - h/2;
  applyView();
}
function dataCentre(){
  var xs = LIBRARIES.map(function(d){return d._x;}).sort(function(a,b){return a-b;});
  var ys = LIBRARIES.map(function(d){return d._y;}).sort(function(a,b){return a-b;});
  var m = Math.floor(xs.length/2);
  return {x:xs[m], y:ys[m]};   /* median — sits in the dense Europe/Levant band */
}
function fitInitial(){
  var r = stage.getBoundingClientRect();
  var aspect = r.width / r.height;
  var b = dataBounds();
  if (aspect < 0.85){
    /* Tall screen: filling the box would leave the map a thin strip.
       Fill vertically around the densest cluster instead; pan for the rest. */
    var h = (b.y1 - b.y0) * 1.45;
    var w = h * aspect;
    var c = dataCentre();
    view.w = w; view.h = h;
    view.x = c.x - w/2;
    view.y = c.y - h/2;
    applyView();
  } else {
    fitBox(b);
  }
}

function fitWorld(){ fitBox({x0:0,y0:0,x1:W,y1:H}); }

function zoomBy(f, cx, cy){
  if (cx === undefined) { cx = view.x + view.w/2; cy = view.y + view.h/2; }
  var nw = view.w / f, nh = view.h / f;
  var minW = W/60, maxW = W*2.2;
  if (nw < minW || nw > maxW) return;
  view.x = cx - (cx - view.x) * (nw / view.w);
  view.y = cy - (cy - view.y) * (nh / view.h);
  view.w = nw; view.h = nh;
  applyView();
}
function clientToWorld(clientX, clientY){
  var r = stage.getBoundingClientRect();
  return {
    x: view.x + (clientX - r.left) / r.width  * view.w,
    y: view.y + (clientY - r.top)  / r.height * view.h
  };
}

/* ---- pointer handling: 1 finger pans, 2 fingers pinch-zoom ---- */
var pointers = {};        /* active pointers by id */
var panStart = null;      /* single-finger pan anchor */
var pinch = null;         /* two-finger gesture state */
var lastTap = 0;

function ptList(){
  var a = []; for (var k in pointers) a.push(pointers[k]); return a;
}
function dist(a,b){
  var dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy);
}
function mid(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }

stage.addEventListener("pointerdown", function(e){
  if (e.target.closest(".mk")) return;
  pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
  try { stage.setPointerCapture(e.pointerId); } catch(err){}

  var p = ptList();
  if (p.length === 1){
    panStart = {sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y};
    pinch = null;
    /* double-tap to zoom in */
    var now = Date.now();
    if (now - lastTap < 300){
      var w = clientToWorld(e.clientX, e.clientY);
      zoomBy(1.8, w.x, w.y);
      lastTap = 0;
    } else lastTap = now;
  } else if (p.length === 2){
    panStart = null;
    var m = mid(p[0], p[1]);
    pinch = {
      d: dist(p[0], p[1]),
      world: clientToWorld(m.x, m.y),
      w: view.w, h: view.h
    };
  }
  stage.classList.add("dragging");
});

stage.addEventListener("pointermove", function(e){
  if (!(e.pointerId in pointers)) return;
  pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
  var p = ptList();
  var r = stage.getBoundingClientRect();

  if (p.length >= 2 && pinch){
    var nd = dist(p[0], p[1]);
    if (nd < 8) return;
    var scale = nd / pinch.d;
    var nw = pinch.w / scale, nh = pinch.h / scale;
    var minW = W/60, maxW = W*2.2;
    if (nw < minW){ nw = minW; nh = minW * (pinch.h/pinch.w); }
    if (nw > maxW){ nw = maxW; nh = maxW * (pinch.h/pinch.w); }
    var m = mid(p[0], p[1]);
    var fx = (m.x - r.left) / r.width, fy = (m.y - r.top) / r.height;
    view.w = nw; view.h = nh;
    view.x = pinch.world.x - fx * nw;
    view.y = pinch.world.y - fy * nh;
    applyView();
    e.preventDefault();
  } else if (p.length === 1 && panStart){
    view.x = panStart.vx - (e.clientX - panStart.sx) / r.width  * view.w;
    view.y = panStart.vy - (e.clientY - panStart.sy) / r.height * view.h;
    applyView();
  }
}, {passive:false});

function dropPointer(e){
  delete pointers[e.pointerId];
  var p = ptList();
  if (p.length < 2) pinch = null;
  if (p.length === 1){
    panStart = {sx:p[0].x, sy:p[0].y, vx:view.x, vy:view.y};
  }
  if (p.length === 0){
    panStart = null;
    stage.classList.remove("dragging");
  }
}
stage.addEventListener("pointerup", dropPointer);
stage.addEventListener("pointercancel", dropPointer);
stage.addEventListener("pointerleave", function(e){
  if (e.pointerType === "mouse") dropPointer(e);
});

stage.addEventListener("wheel", function(e){
  e.preventDefault();
  var w = clientToWorld(e.clientX, e.clientY);
  zoomBy(e.deltaY < 0 ? 1.18 : 1/1.18, w.x, w.y);
}, {passive:false});

/* block the browser's own pinch/double-tap so ours is the only zoom */
stage.addEventListener("gesturestart",  function(e){ e.preventDefault(); });
stage.addEventListener("gesturechange", function(e){ e.preventDefault(); });
stage.addEventListener("dblclick",      function(e){ e.preventDefault(); });

document.getElementById("zin").onclick  = function(){ zoomBy(1.6); };
document.getElementById("zout").onclick = function(){ zoomBy(1/1.6); };
document.getElementById("zres").onclick = function(){ fitInitial(); };
document.getElementById("zworld").onclick = function(){ fitWorld(); };

svg.setAttribute("tabindex","0");
svg.addEventListener("keydown", function(e){
  var step = view.w * 0.08;
  if (e.key === "ArrowLeft"){  view.x -= step; applyView(); e.preventDefault(); }
  if (e.key === "ArrowRight"){ view.x += step; applyView(); e.preventDefault(); }
  if (e.key === "ArrowUp"){    view.y -= step; applyView(); e.preventDefault(); }
  if (e.key === "ArrowDown"){  view.y += step; applyView(); e.preventDefault(); }
  if (e.key === "+" || e.key === "="){ zoomBy(1.3); e.preventDefault(); }
  if (e.key === "-"){ zoomBy(1/1.3); e.preventDefault(); }
});
window.addEventListener("resize", fitInitial);

/* ============ DRAW LAND ============ */
var NS = "http://www.w3.org/2000/svg";

function drawLand(){
  var g = document.getElementById("gLand"), frag = document.createDocumentFragment();
  COASTLINES.forEach(function(d){
    var p = document.createElementNS(NS, "path");
    p.setAttribute("d", d);
    p.setAttribute("class", "country");
    frag.appendChild(p);
  });
  g.appendChild(frag);
}

function drawGraticule(){
  var g = document.getElementById("gGrat"), frag = document.createDocumentFragment();
  for (var lon = -180; lon <= 180; lon += 30){
    var l = document.createElementNS(NS,"line");
    l.setAttribute("x1",px(lon)); l.setAttribute("y1",0);
    l.setAttribute("x2",px(lon)); l.setAttribute("y2",H);
    l.setAttribute("class","grat"); frag.appendChild(l);
  }
  for (var lat = -60; lat <= 80; lat += 30){
    var l2 = document.createElementNS(NS,"line");
    l2.setAttribute("x1",0); l2.setAttribute("y1",py(lat));
    l2.setAttribute("x2",W); l2.setAttribute("y2",py(lat));
    l2.setAttribute("class","grat"); frag.appendChild(l2);
  }
  g.appendChild(frag);
}

/* ============ SITES (de-overlap co-located records) ============ */
/* Several records share one city (Warsaw x4, Sarajevo x3, Mosul x3...).
   Group them, then fan the members out so every record stays clickable. */
var SITES = [];
function buildSites(){
  var byKey = {};
  LIBRARIES.forEach(function(d){
    var k = d.lat.toFixed(1) + "," + d.lon.toFixed(1);
    (byKey[k] = byKey[k] || []).push(d);
  });
  Object.keys(byKey).forEach(function(k){
    var members = byKey[k].sort(function(a,b){ return a.year - b.year; });
    var bx = px(members[0].lon), by = py(members[0].lat);
    if (members.length === 1){
      members[0]._x = bx; members[0]._y = by;
    } else {
      var R = 5.2 + members.length * 0.9;
      members.forEach(function(d,i){
        var a = (i / members.length) * Math.PI * 2 - Math.PI/2;
        d._x = bx + Math.cos(a) * R;
        d._y = by + Math.sin(a) * R;
      });
    }
    members.forEach(function(d){ d._site = members; });
    SITES.push(members);
  });
}

/* ============ MARKERS ============ */
var markEls = {};
function radiusFor(year){
  if (year < 0)    return 3.0;
  if (year < 1000) return 3.3;
  if (year < 1700) return 3.7;
  if (year < 1900) return 4.1;
  return 4.6;
}
function drawMarkers(){
  var g = document.getElementById("gMarks"), frag = document.createDocumentFragment();
  LIBRARIES.forEach(function(d){
    var c = CAUSES[d.cause] || {color:"#999", label:"Unknown"};
    var r = radiusFor(d.year);
    var el = document.createElementNS(NS,"g");
    el.setAttribute("class","mk" + (APPROX[d.id] ? " approx" : ""));
    el.setAttribute("tabindex","0");
    el.setAttribute("role","button");
    el.setAttribute("aria-label", d.name + ", " + d.loc + ", " + yr(d.year) + ", " + c.label);

    var halo = document.createElementNS(NS,"circle");
    halo.setAttribute("class","mk-halo");
    halo.setAttribute("cx",d._x); halo.setAttribute("cy",d._y);
    halo.setAttribute("r", r*2.9);
    halo.setAttribute("stroke", c.color);
    halo.setAttribute("stroke-width","1.4");
    el.appendChild(halo);

    var core = document.createElementNS(NS,"circle");
    core.setAttribute("class","mk-core");
    core.setAttribute("cx",d._x); core.setAttribute("cy",d._y);
    core.setAttribute("r", r);
    core.setAttribute("fill", c.color);
    core.setAttribute("fill-opacity", APPROX[d.id] ? ".35" : ".9");
    el.appendChild(core);

    el.addEventListener("click", function(ev){ ev.stopPropagation(); select(d); });
    el.addEventListener("keydown", function(ev){
      if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); select(d); }
    });
    el.addEventListener("pointerenter", function(ev){ showTip(d, ev); });
    el.addEventListener("pointerleave", hideTip);

    markEls[d.id] = el;
    frag.appendChild(el);
  });
  g.appendChild(frag);
}

/* ============ TOOLTIP ============ */
var tip = document.getElementById("tip");
function showTip(d, ev){
  tip.innerHTML = '<div class="n">' + esc(d.name) + '</div><div class="m">' +
                  esc(d.loc) + ' &middot; ' + yr(d.year) + '</div>';
  tip.style.display = "block";
  var r = stage.getBoundingClientRect();
  var x = ev.clientX - r.left + 14, y = ev.clientY - r.top - 10;
  if (x + 240 > r.width) x = ev.clientX - r.left - 240;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip(){ tip.style.display = "none"; }

/* ============ PANEL ============ */
var panel = document.getElementById("panel");
var pin   = document.getElementById("pin");
var selected = null;

function yr(y){ return y < 0 ? Math.abs(y) + " BC" : y + " AD"; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(m){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]; }); }

function select(d){
  if (selected && markEls[selected.id]) markEls[selected.id].classList.remove("sel");
  selected = d;
  var el = markEls[d.id];
  if (el){ el.classList.add("sel"); el.parentNode.appendChild(el); }

  var c = CAUSES[d.cause] || {color:"#999",label:"Unknown"};
  var html =
    '<div class="pb" style="color:'+c.color+';border-color:'+c.color+'">'+c.label+'</div>' +
    '<div class="pt">'+esc(d.name)+'</div>' +
    '<div class="pl">'+esc(d.loc)+' &middot; '+yr(d.year)+'</div>';
  if (APPROX[d.id]) html += '<div class="papprox">Region-wide record &mdash; pin is indicative</div>';
  html += '<div class="pd">'+esc(d.desc)+'</div>' +
          '<div class="pp"><b>Perpetrator</b><span>'+esc(d.perp)+'</span></div>';

  var srcs = (typeof sourcesFor === 'function') ? sourcesFor(d) : [];
  if (srcs.length){
    html += '<div class="psrc"><b>Sources</b>';
    srcs.forEach(function(s){
      html += s.url
        ? '<a href="'+s.url+'" target="_blank" rel="noopener">'+esc(s.label)+'</a>'
        : '<span>'+esc(s.label)+'</span>';
    });
    html += '</div>';
  }

  if (d._site && d._site.length > 1){
    html += '<div class="psame"><b>'+(d._site.length-1)+' more at this location</b>';
    d._site.forEach(function(o){
      if (o.id === d.id) return;
      var oc = CAUSES[o.cause] || {color:"#999"};
      html += '<button data-go="'+o.id+'" style="border-color:'+oc.color+'">'+
              esc(o.name)+' &middot; '+yr(o.year)+'</button>';
    });
    html += '</div>';
  }
  pin.innerHTML = html;
  pin.querySelectorAll("[data-go]").forEach(function(b){
    b.onclick = function(){
      var id = +b.getAttribute("data-go");
      var t = LIBRARIES.filter(function(x){ return x.id === id; })[0];
      if (t) select(t);
    };
  });

  panel.classList.add("open");
  panel.setAttribute("aria-hidden","false");

  /* centre on the pin, and zoom in if we are still far out */
  if (view.w > W/5){
    var f = (W/5) / view.w;
    view.w *= f; view.h *= f;
  }
  view.x = d._x - view.w/2;
  view.y = d._y - view.h/2;
  applyView();
}
document.getElementById("pclose").onclick = function(){
  panel.classList.remove("open");
  panel.setAttribute("aria-hidden","true");
  if (selected && markEls[selected.id]) markEls[selected.id].classList.remove("sel");
  selected = null;
};
document.addEventListener("keydown", function(e){
  if (e.key === "Escape") document.getElementById("pclose").click();
});

/* ============ FILTERS ============ */
var fCause = "all", fEra = 0;

function buildCauseButtons(){
  var row = document.getElementById("causeRow");
  function mk(key, label, color){
    var b = document.createElement("button");
    b.className = "fb";
    b.setAttribute("aria-pressed", key === "all" ? "true" : "false");
    b.dataset.k = key;
    b.innerHTML = (color ? '<span class="sw" style="background:'+color+'"></span>' : "") + label;
    b.onclick = function(){
      fCause = key;
      row.querySelectorAll(".fb").forEach(function(x){
        x.setAttribute("aria-pressed", x.dataset.k === key ? "true" : "false");
      });
      applyFilters();
    };
    row.appendChild(b);
  }
  mk("all","All");
  Object.keys(CAUSES).forEach(function(k){ mk(k, CAUSES[k].label, CAUSES[k].color); });
}

function applyFilters(){
  var era = ERAS[fEra], shown = 0, sites = {};
  LIBRARIES.forEach(function(d){
    var ok = (fCause === "all" || d.cause === fCause) &&
             (d.year >= era.a && d.year < era.b);
    var el = markEls[d.id];
    if (el) el.style.display = ok ? "" : "none";
    if (ok){ shown++; sites[d.lat.toFixed(1)+","+d.lon.toFixed(1)] = 1; }
  });
  document.getElementById("sShown").textContent = shown;
  document.getElementById("sSites").textContent = Object.keys(sites).length;
}

document.getElementById("era").addEventListener("input", function(){
  fEra = +this.value;
  document.getElementById("eraOut").textContent = ERAS[fEra].l;
  applyFilters();
});

/* ============ BOOT ============ */
function start(){
  buildSites();
  drawGraticule();
  drawLand();
  drawMarkers();
  fitInitial();
  applyFilters();
}

buildCauseButtons();
if (document.readyState === "complete" || document.readyState === "interactive") start();
else document.addEventListener("DOMContentLoaded", start);
</script>
</body>
</html>
